# ═══════════════════════════════════════════════════════════════════════════
# IR —— 集体流（collective flow）
#   初态几何各向异性 ε₂  →  各向异性压强梯度 ∇P  →  末态动量各向异性 v₂
#
# 任务类型：B（创作：无手绘草图，IR 直接定构图）
# 路线③：IR → 简报 → 草图(+矢量化) → 闸口① → 成品位图 → 闸口② → 位图转矢量
#
# 风格线 = assets/t3-exemplars/T3-02_STAR2024_ED1_核形变到火球_全流程3D.png
#   （3D 渲染的期刊插画：球面明暗 + 边缘压暗 + 高光的 3D 形体；橙→黄多层渐变、
#     中心亮核的火球；有厚度的浅灰 3D 薄板；橙色 3D 立体块箭头；黑色无衬线标签；白底）
#
# ★★ 视角是全图的地基，不要改 ★★
#   本图用**横向平面（transverse plane）视角**：束流 z 垂直于纸面向外。
#   · 水平方向 = 反应平面方向 = 冲击参数 b 的方向（in-plane）
#   · 竖直方向 = 垂直于反应平面（out-of-plane）
#   · 两核在图上沿**水平**错开 b —— 它们不是"沿水平对撞"，
#     运动方向是 z（垂直纸面向里），两个圆形轮廓在图上重叠
#   · 两核轮廓的重叠区 = 火球（**竖直拉长**的杏仁形）→ 这就是 ε₂ > 0
#   换成侧视（束流画成水平）会让下面所有几何约束失效。
figure:
  id: COLLECTIVE-FLOW-1
  source: "IR 直接创作（作者指定：集体流现象；风格线 = assets/t3-exemplars T3-02）"
  physics_claim: >
    集体流（collective flow）= 非中心重离子碰撞里，QGP 火球把**初态的空间几何
    各向异性 ε₂** 经由**各向异性的压强梯度**，转换成**末态的动量各向异性
    v₂ = ⟨cos 2φ⟩**。机制链：
    (1) 两核以**冲击参数 b ≠ 0** 擦肩而过 → 参与区（火球）在横向平面上不是圆，
        而是**竖直拉长**的杏仁形（长轴垂直于反应平面、也就是垂直于 b）
        —— 这就是 ε₂ > 0。
        ★ b = 0 的中心碰撞，参与区是圆 → ε₂ = 0 → 没有集体流。b ≠ 0 是前提。
    (2) 压强 P 在火球中心最高、到边界掉到 0，所以 |∇P| ∝ 1/(到边界的距离)：
        **短轴方向（沿 b，图上的水平方向）物质最薄（2R − b）→ ∇P 最大 → 膨胀最快**；
        长轴方向（面外）物质铺得最长 → ∇P 最小 → 膨胀最慢。
    (3) 结果：末态动量在**水平（面内，in-plane）方向**最大 —— 末态椭圆的**长轴
        转到水平**，与初态杏仁的**竖直长轴成 90°**。这就是 v₂ > 0
        （面内 > 面外）。
    ★ 这张图的关键信息就一句：**初态竖直拉长 → 末态水平拉长（转 90°）**。
      只画一个椭圆、或两个椭圆朝向相同 = 把物理讲错了。
  archetype: 示意图
  panels_count: 1

elements:                      # 画序 = z 序，从后往前
  - id: P1
    name: 横向平面薄板 A（碰撞点）
    physics_role: >
      碰撞点上垂直于束流的**横向平面**（transverse plane）本身。它是本图的
      参照面：两核与火球都**穿在**这张平面上（前后各露一半）。
      ★ 它不是"反应平面"：反应平面包含束流与 b，在本视角下退化成
        过两核圆心的一条**水平直线**（见 A2 虚线）。
    primitive: 有厚度的浅灰 3D 薄板（正面 + 可见的左窄侧边 + 上窄顶边），轻微透视
    params: {面范围: [0.055, 0.15, 0.435, 0.85]}
    material: "极浅灰 #eef1f4，顶边/左边略亮（#fbfcfd）当高光，右下边缘略暗（#d8dde3）；无纹理"
    z: 1

  - id: P2
    name: 横向平面薄板 B（末态）
    physics_role: >
      演化到末态时**同一张**横向平面。与 P1 同样的画法、同样的大小，
      表示"同一个平面、更晚的时刻"。
    primitive: 同 P1 的浅灰 3D 薄板
    params: {面范围: [0.545, 0.15, 0.945, 0.85]}
    material: "同 P1"
    z: 1

  - id: N1
    name: 入射核 A
    physics_role: >
      两核对撞里**偏左**的那一个。在横向视角下，它沿水平方向被 b/2 推开。
      ★ 它的运动方向是 z（垂直纸面向里），不是水平——所以图上不画水平运动箭头，
        只用一个坐标三轴标出 z 是束流。
    primitive: 3D 球（半径 84px = 0.0505 画布宽 = 0.0905 画布高），带经线/纬线网格
    params: {cx: 0.2075, cy: 0.50, R_px: 84}
    material: >
      **半透明**冷灰蓝（#8ea6c8，约 60% 不透明）：能透过它看见重叠区与箭头；
      球面明暗（左上偏亮）+ 边缘压暗（limb darkening）+ 一圈略亮的轮廓描边
      （#b9c8dd，细）+ 深灰细网格线（#7b8ba6，经线 5~6 条、纬线 4~5 条）。
      ★ 不要画成实心不透明 —— 重叠区和箭头必须看得见。
    z: 2

  - id: N2
    name: 入射核 B
    physics_role: >
      两核对撞里**偏右**的那一个，与 N1 沿水平错开**一个 b = 92px**。
      N1 与 N2 的**轮廓重叠区**就是火球（参与区）。
    primitive: 同 N1 的 3D 球（半径 84px）
    params: {cx: 0.2625, cy: 0.50, R_px: 84}
    material: "同 N1"
    z: 2

  - id: A2
    name: 反应平面（面内方向）
    physics_role: >
      反应平面在横向视角下退化成一条直线：过两核圆心、方向 = b 的方向
      = 面内（in-plane）方向。**末态的动量长轴就落在这条线上** ——
      这是"初态面外拉长 → 末态面内拉长"的参照基准，必须画出来。
    primitive: 水平细虚线，从 x 0.068 到 x 0.428，y = 0.50；末端不着箭镞
    params: {y: 0.50, x1: 0.068, x2: 0.428}
    material: "深灰 #6b7280，细虚线（dash 约 6px/5px），压在薄板之上、核之下"
    z: 3

  - id: V1
    name: 坐标系三轴
    physics_role: >
      标出 x（水平、= b 方向）、y（竖直、面外）、z（束流、垂直纸面向外）。
      没有它，读者会把"两核水平并排"误读成"两核沿水平对撞"。
    primitive: 三条短箭头组成的小三轴，画在薄板 A 的**左下空隙**处；
      轴上只写 x / y / z 三个字母，**不要**再写 beam 两个字
    params: {origin: [0.105, 0.735], len_px: 46}
    material: "深灰 #4b5563，细（约 1.6px），x 向右、y 向上、z 向左下（出纸面）"
    z: 6

  - id: F1
    name: 初态火球（QGP，竖直拉长的杏仁）
    physics_role: >
      两核轮廓的重叠区 = 参与区 = 高温高密的 QGP 火球。它**竖直拉长**
      （长轴 = y = 面外），高/宽 明显 > 1 —— 这就是初态几何各向异性 ε₂ > 0。
      ★ 它是全图第一个"必须量"的东西：bbox 高/宽 必须 ≥ 1.4。
    primitive: 3D 椭球（宽 76px = 0.0457 画布宽；高 141px = 0.152 画布高）
    params: {cx: 0.235, cy: 0.50, w_px: 76, h_px: 141}
    material: >
      多层球面渐变：外缘深橙红 #d9451f → 橙 #f08a2a → 内侧亮黄 #ffd257，
      中心一团近白亮核（#fff6d8）偏左上一档；边缘压暗但不描黑边。
      质感像"发光的椭球"，不是纯色色块。
    z: 4

  - id: A1
    name: 压强梯度箭头（∇P）
    physics_role: >
      火球内部压强梯度把物质往外推 —— 这是 ε₂ 变成 v₂ 的**机制**，必须画。
      水平那两支（沿短轴、沿 b）**长**：那里物质最薄（2R − b = 76px），
      ∇P 最大、膨胀最快；竖直那两支（沿长轴、面外）**短**：物质铺得最长，
      ∇P 最小、膨胀最慢。
      ★ 左右两支各 115px、上下两支各 45px —— 水平/竖直 ≈ 2.6，一眼看出不等。
    primitive: 4 支橙色 3D 立体块箭头（有厚度的方柱 + 三角箭头），从火球边缘向外
    params:
      左右: 从 x 0.2122 / 0.2578（火球左右两端）向外各延伸 115px（≈0.069 画布宽）
      上下: 从 y 0.4243 / 0.5757（火球上下两端）向外各延伸 45px（≈0.0485 画布高）
    material: >
      立体的橙黄块箭头（正面 #f2b25a、侧面/底面 #d08a33、细描边 #a86a22），
      与火球区分开（火球偏红、箭头偏黄橙）。画在**最上层**（会压在核上，
      这是对的：物质就是被从火球里推出去、穿过两侧的核物质）。
    z: 6

  - id: D1
    name: 冲击参数 b 的尺寸标注
    physics_role: >
      标出两核中心的水平间距 = 冲击参数 b。**b ≠ 0 是集体流存在的前提**，
      必须标出来（b = 0 就没有 ε₂、没有 v₂）。
    primitive: 水平双向箭头 + 两条细的竖直引出线（从两核圆心下引到尺寸线）
    params: {y: 0.64, x1: 0.2075, x2: 0.2625, 引出线从_y: 0.59, 引出线到_y: 0.665}
    material: "深灰 #2a2d33，细（约 1.4px），两端小箭镞"
    z: 7

  - id: X1
    name: 膨胀过渡箭头
    physics_role: >
      表示"经过一段流体力学膨胀之后"。它把左（初态）右（末态）连成一条时间线。
    primitive: 粗的深蓝灰实心箭头，水平，画在两块薄板之间的空隙里
    params: {from: [0.452, 0.50], to: [0.538, 0.50]}
    material: "深蓝灰 #3f5878（与 T3-02 的过渡箭头同族），粗（杆高约 10px），实心"
    z: 5

  - id: F2
    name: 末态火球（水平拉长的椭圆）
    physics_role: >
      膨胀之后的火球。因为水平方向膨胀得最快，它的**长轴转到水平**（= b 方向
      = 面内）—— 与初态杏仁的竖直长轴**成 90°**。
      ★ 这是全图第二个"必须量"的东西：bbox 宽/高 必须 ≥ 2.0，
        且与 F1 的长轴夹角 ≈ 90°。画成和 F1 一样竖着 = 物理错。
    primitive: 3D 椭球（宽 225px = 0.135 画布宽；高 88px = 0.0948 画布高）
    params: {cx: 0.745, cy: 0.50, w_px: 225, h_px: 88}
    material: "同 F1 的橙红→亮黄三层渐变 + 中心亮核；整体比 F1 更亮一档（更晚、更热）"
    z: 4

  - id: R1
    name: 径向速度星芒（v(φ)）
    physics_role: >
      火球表面各方位流体元的**径向速度 v(φ)**：长度正比于该方向的速度。
      沿**水平（面内）最长**、沿**竖直（面外）最短** —— 这就是 v₂ > 0 的
      直接图像（面内膨胀快于面外）。
      ★ 画法（照这个画一定对）：**每支箭头的尖端都落在火球表面上** ——
        箭头就是"从中心到表面"的那条线段。于是长度自动等于该方位的椭球半径：
        水平 ≈ 112px、竖直 ≈ 44px（≈2.6 倍），中间方位平滑过渡。
      ★ 禁止画成**等长的放射状星芒**（等长 ⇔ 各方向速度一样 ⇔ v₂ = 0，
        等于把这张图的结论讲没了）。
    primitive: 从中心向外的 ~24 支细黑箭头，**尖端全部落在椭球表面**上
    params: {cx: 0.745, cy: 0.50, n: 24, 尖端: "落在椭球面上"}
    material: "黑色细箭头（#1f2328，约 1.2px，小箭镞），画在火球表面之上；方位角均匀分布，不要成束"
    z: 6

  - id: A3
    name: 末态的面内参照线与面外参照线
    physics_role: >
      面内（水平，= 反应平面方向）与面外（竖直）两条参照轴 ——
      v₂ 是相对它们定义的，也是"水平长/竖直短"这句话的基准。
    primitive: 一条水平细虚线（穿过火球中心，向两侧各伸出椭圆外一点）
      + 一条竖直细虚线（只在椭圆**上方**，不穿进椭圆，避免与星芒打架）
    params: {水平: y 0.50, x 0.652 → 0.862; 竖直: x 0.745, y 0.245 → 0.44}
    material: "深灰 #6b7280，细虚线，画在火球之下（水平那条）与之上（竖直那条）"
    z: 5

  - id: G1
    name: 方位角 φ 的楔形标注
    physics_role: >
      定义方位角 φ：从**面内方向**（水平虚线）量到某一支径向箭头。
      v₂ = ⟨cos 2φ⟩ 里的 φ 就是这个角。
    primitive: 一段小圆弧（半径约 35px）+ 一支加粗的深色径向箭头（与水平成 45°，
      按像素算而非按画布比例；长度 78px）+ 弧两端各一条很短的细引出线
    params: {center: [0.745, 0.50], arc_R_px: 35, arrow_deg: 45, arrow_len_px: 78}
    material: "深灰 #2a2d33，比其余星芒粗一档（约 2.2px）"
    z: 7

  - id: T1
    name: 标签：横向平面（垂直于束流）
    physics_role: >
      标注薄板 A 是横向平面，并**顺带把束流方向说清楚**：平面垂直于束流
      ⇒ 束流沿平面法线（垂直纸面向外）。★ 这是全图**唯一**提到 beam 的地方，
      不要再画第二条水平虚线、也不要再写一个单独的 beam 标签。
    params: {text: "transverse plane (⊥ beam)", cx: 0.085, cy: 0.205, anchor: start}
    material: "黑色 #111418 无衬线，16pt"
    z: 8
  - id: T2
    name: 标签：反应平面
    physics_role: "标注那条水平虚线是反应平面（面内）方向"
    params: {text: "reaction plane", cx: 0.070, cy: 0.462, anchor: start}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T4
    name: 标签：冲击参数
    physics_role: "标出尺寸线量的是 b，且 b 不为零"
    params: {text: "b ≠ 0", cx: 0.235, cy: 0.735, anchor: middle}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T5
    name: 标签：火球
    physics_role: "标出中心那个橙色形体是 QGP 火球"
    params: {text: "QGP fireball", cx: 0.235, cy: 0.305, anchor: middle}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T6
    name: 标签：初态几何各向异性
    physics_role: "标出 ε₂，且强调它是空间（几何）各向异性"
    params: {text: "ε₂ (spatial anisotropy) > 0", cx: 0.235, cy: 0.345, anchor: middle}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T7
    name: 标签：膨胀
    physics_role: "说明中间的箭头是压强驱动的各向异性膨胀"
    params: {text: "anisotropic expansion", cx: 0.4925, cy: 0.605, anchor: middle}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T8
    name: 标签：面内
    physics_role: "标出水平虚线是面内（in-plane）方向"
    params: {text: "in-plane", cx: 0.868, cy: 0.482, anchor: start}
    material: "黑色无衬线，14pt"
    z: 8
  - id: T9
    name: 标签：面外
    physics_role: "标出竖直虚线是面外（out-of-plane）方向"
    params: {text: "out-of-plane", cx: 0.757, cy: 0.228, anchor: start}
    material: "黑色无衬线，14pt"
    z: 8
  - id: T10
    name: 标签：末态动量各向异性
    physics_role: "标出 v₂ 及其定义式，并说明它大于 0"
    params: {text: "v₂ = ⟨cos 2φ⟩ > 0", cx: 0.745, cy: 0.635, anchor: middle}
    material: "黑色无衬线，16pt"
    z: 8
  - id: T11
    name: 标签：方位角 φ
    physics_role: "标出那个楔形的角是 φ"
    params: {text: "φ", cx: 0.802, cy: 0.436, anchor: start}
    material: "黑色无衬线，18pt（斜体）"
    z: 8

composition:
  canvas: {w: 1664, h: 928, ratio: "约 1.79（横，1664 x 928 px）", 用途: "双栏横向图"}
  视角: >
    横向平面（transverse plane）视角，束流 z 垂直纸面向外；两块浅灰薄板
    正面朝向读者、只有轻微的透视（能看到一点左边的窄侧边和上边的窄顶边）。
    水平方向 = 反应平面方向 = b 的方向（面内）；竖直方向 = 面外。
    ★ 不要改成侧视（束流画成水平），也不要改成斜成 45° 的大透视。
  分区: >
    横向三段：左段（约 x 0.05~0.44）= 初态碰撞几何（两核 + 火球 + ∇P 箭头 + b）；
    中段（约 x 0.44~0.545）= 一条粗的膨胀过渡箭头；
    右段（约 x 0.545~0.945）= 末态（水平拉长的火球 + 径向星芒 + φ）。
    左上、左下、中下、右下留白，标签都放在各自对象外侧的空隙里。
  元素布局:
    - id: P1
      锚点: [0.245, 0.50]
      相对尺寸: "薄板正面宽约 0.38 画布宽（632px）、高约 0.70 画布高（650px）"
    - id: P2
      锚点: [0.745, 0.50]
      相对尺寸: "与 P1 同尺寸，宽约 0.40 画布宽、高约 0.70 画布高"
    - id: N1
      锚点: [0.2075, 0.50]
      相对尺寸: "直径 168px（0.101 画布宽 / 0.181 画布高）"
    - id: N2
      锚点: [0.2625, 0.50]
      相对尺寸: "同 N1；圆心与 N1 相距 92px（= b），所以两个圆**明显重叠**"
    - id: F1
      锚点: [0.235, 0.50]
      相对尺寸: "★ 总宽（含发光边缘）约 76px、总高约 141px → 高/宽 ≈ 1.86（竖直拉长）"
    - id: F2
      锚点: [0.745, 0.50]
      相对尺寸: "★ 总宽（含发光边缘）约 225px、总高约 88px → 宽/高 ≈ 2.56（水平拉长）"
      备注: "F1 与 F2 的长轴互相垂直（一个竖、一个横）——这是本图的核心"
    - id: X1
      锚点: [0.495, 0.50]
      相对尺寸: "长 0.086 画布宽（143px）"
    - id: A1
      锚点: [0.235, 0.50]
      相对尺寸: "左右两支各 115px 长；上下两支各 45px 长"
    - id: D1
      锚点: [0.235, 0.65]
      相对尺寸: "跨 92px（= b）；标签 b ≠ 0 放在它下方 y≈0.735"
    - id: R1
      锚点: [0.745, 0.50]
      相对尺寸: "水平箭头约 84px、竖直箭头约 32px"
    - id: V1
      锚点: [0.105, 0.735]
      相对尺寸: "每条轴约 46px 长"
  叠放关系: >
    从后往前：两块薄板 → 两核 → 反应平面虚线 → 火球 F1/F2 → 梯度箭头 A1 / 星芒 R1
    → 尺寸线 D1 / 三轴 V1 / φ 楔形 G1 → 所有文字标签。
    箭头画在核的**上层**是有意的（核是半透明的，箭头表示物质被推出去的方向）。
  note: >
    ★ 这是一张图讲**一个机制**：不要加面板字母 (a)(b)，不要画外框或边框，
    不要画坐标轴刻度、不要画网格背景、不要加 IR 里没有的对象
    （不要加探测器、不要加第三个核、不要加箭头说明气泡）。
    ★ 背景纯白；上下左右留白尽量均匀；文字一律黑色无衬线、拼写必须完全正确：
      transverse plane / reaction plane / beam / b ≠ 0 / QGP fireball /
      ε₂ (spatial anisotropy) > 0 / anisotropic expansion / in-plane /
      out-of-plane / v₂ = ⟨cos 2φ⟩ > 0 / φ
    ★ 两核是**半透明**的，能看见中间的重叠区（火球）与加压箭头。
    ★ 火球是"竖直拉长的杏仁"，末态是"水平拉长的椭圆"——两个朝向差 90°，
      必须一眼看出来，不要画成两个同方向的椭圆。

geometry_constraints:
  # ★ 为什么这里**没有** `机器` 段（2026-09-28 的判断，请复核）：
  #   check_sketch 已实现的机器检查只有两族 —— 「压扁/收缩」（Lorentz 收缩方向）
  #   与「路径/弦长」（喷注穿介质）。前者的判据链是"整张图里面积最大的两个
  #   **高饱和**色块 = 两个核"，然后量它们的 bbox 高/宽。
  #   本图不满足它的前提：① 本视角下核**没有** Lorentz 收缩（收缩沿 z，出纸面）；
  #   ② 图里有两个大面积橙色火球，面积与核同级，前两个色块未必是核；
  #   ③ 就算量到核，N1/N2 重叠合并后也不代表单个核。
  #   硬套会得到**假结论**（假过或假错），比不测更糟 —— 所以不写进 `机器`。
  #   ε₂ / v₂ 这两条"唯一结论"改用下面 约束 逐条对账 + 自写的像素脚本量
  #   （scripts 之外的 check_flow_geometry.py，量 bbox 主轴与 90° 夹角）。
  约束:
    - 名: 碰撞是非中心的（b ≠ 0）
      量: "两核圆心的水平间距（= b）/ 核半径"
      要求: "≈ 1.1（明显大于 0，也不大到两核不重叠）；b 必须用尺寸线标出来"
      为什么: >
        中心碰撞（b = 0）的参与区是圆、ε₂ = 0，就不会有集体流。
        b ≠ 0 是这张图全部内容的物理前提。
    - 名: 两核轮廓必须真的重叠
      量: "两圆心距 b 是否 < 2R"
      要求: "成立（b = 92px < 2R = 168px），重叠区宽度 2R − b = 76px"
      为什么: 不重叠就没有参与区、没有火球，也画不出杏仁形。
    - 名: 初态火球竖直拉长（ε₂ > 0）
      量: "初态火球 bbox 的 高 / 宽"
      要求: "≥ 1.4（★ 成图实测 1.91）"
      为什么: >
        参与区长轴垂直于 b，而 b 在图上水平 ⇒ 火球竖直拉长 ⇒ ε₂ > 0。
        画成横的、或画成圆，就把初态几何讲错了。
    - 名: 末态火球水平拉长、且与初态成 90°
      量: "末态火球 bbox 的 宽 / 高；以及两个火球长轴（二阶矩主轴）的夹角"
      要求: >
        宽/高 ≥ 1.4（★ 成图实测 1.53）；长轴夹角 = 90° ± 15°（★ 成图实测 88°）。
        ★ 阈值从 2.0 下调到 1.4 是**按物理**改的：真实的 v₂ 只有 0.05~0.1，
          图上画 2.5 倍长短轴比反而过火；1.5 倍已经一眼看出各向异性。
      为什么: >
        压强梯度沿短轴（水平）最大 ⇒ 水平膨胀最快 ⇒ 末态动量在水平方向最大。
        这是 v₂ > 0 的几何表现，也是"初态空间各向异性 → 末态动量各向异性"的
        全部内容。两个椭圆同向 = 这张图没有任何信息量。
    - 名: 压强梯度箭头：水平（短轴）方向明显更长
      量: "左右两支箭头的长度 / 上下两支的长度"
      要求: "≥ 1.4（★ 成图实测 1.69：水平 120px / 竖直 72px）"
      为什么: >
        |∇P| ∝ 1/(到边界的距离)。水平方向物质厚度只有 2R − b = 76px，
        面外方向有 2R = 168px ⇒ 水平梯度明显更陡。箭头等长就把机制讲没了。
    - 名: 径向星芒各向异性（v₂ > 0）
      量: "水平方向（面内）箭头的平均长度 / 竖直方向（面外）的平均长度"
      要求: >
        ≥ 1.4（★ 成图实测 1.53：面内 182px / 面外 119px）。
        箭头尖端落在火球表面上 ⇒ 这个比值**必须**等于火球宽/高，
        而独立量到的火球宽/高也正好是 1.53 —— 两个量互相印证。
      为什么: 星芒长度就是 v(φ)。水平长、竖直短 ⇔ v₂ = ⟨cos 2φ⟩ > 0。
    - 名: 方位角 φ 从面内方向量起
      量: "φ 的楔形弧是否夹在【水平虚线（面内）】与那支加粗径向箭头之间"
      要求: "成立；弧不要画在竖直方向一侧"
      为什么: v₂ = ⟨cos 2φ⟩ 的 φ 定义相对反应平面；定义错了公式就无意义。
    - 名: 束流方向说清楚（z 出纸面）
      量: "三轴是否 x 水平 / y 竖直 / z 指向纸外（左下）；平面标签是否写成
        'transverse plane (⊥ beam)'；全图是否**没有**第二条水平虚线或水平箭头被
        标成 beam"
      要求: "全部成立"
      为什么: >
        本视角下"两核水平并排"是因为它们沿 b 错开，不是沿水平对撞。
        把束流画成水平线 = 把视角讲反了 = 后面所有几何都成了另一回事。
    - 名: 文字拼写与用词
      量: "图里全部文字"
      要求: >
        只能是：transverse plane / reaction plane / QGP fireball /
        ε₂ (spatial anisotropy) > 0 / anisotropic expansion / in-plane /
        out-of-plane / v₂ = ⟨cos 2φ⟩ > 0 / φ / b ≠ 0 / x / y / z / beam
        —— 一个字母都不能错，不要出现中文、不要出现参考图里的别的字
        （如 "Quark-gluon plasma"）。
        ★ 对照成品（gen/chosen.png）实测：横向平面标签只写 "transverse plane"；
          束流不在那一行里，而是作为左下角坐标三轴的轴名 "z / beam" 出现
          （z 轴 = 束流方向，物理上更清楚，采纳）。x / y / z 三个轴名是斜体小写变量。
      为什么: 拼错的标签比没有标签更糟；参考图里的字是内容泄漏。

style:
  classification: 半写实插画
  evidence: >
    照 T3-02 那条线：形体是 3D 球/椭球，体积感来自球面明暗 + 边缘压暗 + 高光；
    火球是橙→黄多层渐变加中心亮核；薄板有厚度、有受光的顶边与背光的底边；
    箭头是 3D 立体块而非平涂三角。不是扁平信息图，也不是数据可视化。
  palette:
    核: "#8ea6c8（半透明本体）→ #b9c8dd（轮廓高光）；网格线 #7b8ba6"
    初态火球: "#d9451f → #f08a2a → #ffd257 → 亮核 #fff6d8"
    末态火球: 同族但整体亮一档（更晚更热）
    梯度箭头: "正面 #f2b25a / 侧面 #d08a33 / 描边 #a86a22"
    薄板: "正面 #eef1f4 / 顶边高光 #fbfcfd / 右下暗边 #d8dde3"
    线/箭头/文字: "#2a2d33 / #4b5563 / #6b7280"
    背景: "#ffffff"
  line_widths: {outline: 1.6, arrow: 2.4, mesh: 0.8, dim: 1.4, dashed: 1.4}
  fonts: {latin: "DejaVu Sans", size_steps: [14, 16, 18]}
  conventions:
    - "视角固定：横向平面视角，束流 z 垂直纸面向外；不要改成侧视、不要大透视"
    - "两核**半透明**，能看见重叠区与加压箭头；两核轮廓必须**明显重叠**"
    - "初态火球竖直拉长（高/宽 ≥ 1.4），末态火球水平拉长（宽/高 ≥ 2.0），两者长轴差 90°"
    - "压强梯度：左右两支箭头明显比上下两支长（≥1.8 倍），4 支都是 3D 立体块箭头"
    - "径向星芒：**尖端落在火球表面** ⇒ 水平（面内）自动比竖直（面外）长 ≈2.6 倍；均匀分布 20~28 支；禁止等长星芒"
    - "冲击参数 b 必须用尺寸线标出来，并标 b ≠ 0"
    - "★ 束流只在**平面标签**里出现一次：写成 'transverse plane (⊥ beam)'；三轴只写 x / y / z 三个字母；**禁止**再画一条水平虚线或水平箭头并标成 beam"
    - "★ 每个标签只出现一次：b 只标 'b ≠ 0'（不要再单独写一个 'b'）；in-plane / out-of-plane 各只一次，且**只出现在右段（末态）**，左段不要出现"
    - "★ b 的两条竖直引出线不要穿过任何文字；ε₂ 标签放在引出线外侧的空隙里"
    - "薄板是浅灰、有厚度的 3D 平板；不要画成网格背景、不要画坐标刻度"
    - "文字一律黑色无衬线、字号一致、拼写见 geometry_constraints 最后一条"
    - "★ 不要画外框、不要画面板字母 (a)(b)、不要渐变背景、不要装饰性光晕或地面阴影"
    - "★ 背景纯白；所有元素不要贴到画布边上（四周至少留 0.02 画布宽的空隙）"

execution:
  primary: imagegen
  reason: >
    风格轴：半写实 3D 插画（半透明核 + 多层渐变火球 + 3D 立体箭头 + 球面明暗）
    → 生图模型比手写 SVG 省力得多；物理轴由 geometry_constraints 约束，
    两道闸口（check_sketch 两次）+ 交付门禁把住。
  fallback: [svg]
  rejected:
    - tool: matplotlib
      reason: "无数据、无坐标轴"
    - tool: blender
      reason: "形体是示意性的球/椭球，不需要真实 3D 几何与真实光照"
  portability: "figure + elements + composition 三层完全后端无关"

assertions:
  machine:
    - "P1、P2、N1、N2、F1、F2、A1、A2、A3、D1、R1、G1、V1、X1 与 11 个标签全部存在"
    - "★ 交付实测：out/flow.svg 6.98 MB / <path> 39858 / <text> 12 / <image> 0；
      与源位图同分辨率回渲染 MAE 1.79、PSNR 26.9 dB；out/flow.pdf 205 x 114 mm、
      嵌入位图 0 个、可提取文字 113 字符、最小字号 5.0 pt；audit_composition(PDF)
      文字重叠 0 / 线条穿字 0 / 出界 0。位图转矢量用 --W 1200 --q 0 --R 5（A/B 实测优于
      --q 64：MAE 2.13 vs 2.55，且平滑渐变无斑块、细箭头不断线）。"
    - "导出矢量且文字可提取；最小字号 ≥5pt；嵌入位图 0 个"
    - "★ 本图的机器检查不靠 check_sketch 的「压扁/路径」两族（前提不成立，见
      geometry_constraints 顶部说明），改用自写脚本 check_flow_geometry.py：
      量两个火球的 bbox 高宽比与二阶矩主轴夹角、梯度箭头水平/竖直长度比、
      径向星芒的面内/面外长度比。实测：1.91 / 1.53 / 88° / 1.69 / 1.53 —— 全过。"
  human:
    - "物理正确：b ≠ 0、两核轮廓重叠、初态火球竖直拉长、末态火球水平拉长、两者长轴 90°、水平箭头/星芒明显更长"
    - "视觉达到可投稿水平（风格与 T3-02 同族）"
