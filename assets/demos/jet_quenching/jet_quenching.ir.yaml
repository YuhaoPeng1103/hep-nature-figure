# IR —— 喷注淬火（jet quenching）：双喷注的不对称
# 任务类型：B（创作：无手绘草图，IR 直接定构图）
# 默认路线③：IR → 简报 → 草图(+矢量化) → 闸口① → 成品位图 → 闸口② → 语义临摹
figure:
  id: JET-QUENCH-1
  source: "IR 直接创作（作者指定：喷注淬火；风格线 = _T3精选 T3-02）"
  physics_claim: >
    高能重离子碰撞里，硬散射在极早期（火球还在形成时）就产生一对**背对背的部分子**
    （dijet）。这一对部分子随后必须**穿过介质**才能逃逸。夸克-胶子等离子体对
    **带色荷的**部分子是强相互作用的介质：穿过的部分子会通过**胶子轫致辐射**
    （gluon bremsstrahlung）把能量不断沉积给介质 —— 这就是**喷注淬火**。
    结果是不对称：**穿过介质路径长**的那一侧喷注被压低（能量少、高 pT 强子少、
    末态喷注偏软），**路径短**的那一侧几乎不受影响。
    物理意义：这就是"双喷注不对称"（dijet asymmetry）与核修正因子
    R_AA < 1 的微观图像，也是 QGP 存在的最直接证据之一。
    注意：能量损失正比于**穿过介质的路径长度**，所以"一侧长、一侧短"是这张图的
    关键信息 —— 不是"一侧被挡住"。
    视角：**斜视 3D** —— 介质画成有体积的椭球团块（束流方向竖直），
    两个喷注在横向平面内背对背飞出，用锥形+强子团表现末态。
  archetype: 示意图
  panels_count: 1
  canvas: {w: 1664, h: 928}

elements:                      # 画序 = z 序，从后往前
  - id: M1
    name: QGP 介质
    physics_role: >
      碰撞产生的夸克-胶子等离子体。束流方向竖直 → 介质在图上**竖直拉长**
      （不是圆球）。它是**半透明**的：要能看见里面的喷注轨迹、顶点与胶子辐射。
    primitive: 竖直拉长的椭球（半透明）+ 边界羽化
    params: {cx: 0.50, cy: 0.47}
    material: >
      **半透明发光体**：橙→红的球面明暗（3D 体积感），中心偏亮点略偏左上；
      靠近轮廓再压暗一档（limb darkening）让边缘"转过去"；最外层橙红日冕边缘
      羽化散开。整体透明度约 55%~70% —— 里面的喷注、顶点、辐射点必须**看得清**。
      ★ 表面只在**大尺度**上有结构（层壳厚度、日冕羽化、3~5 条又宽又柔的弯曲
      丝状亮带）；**禁止**细密颗粒/噪点/抖动纹理（矢量化时会变成脏块）。
    z: 1

  - id: V1
    name: 硬散射顶点
    physics_role: >
      一对背对背部分子的产生点。它必须在**介质内部**（硬散射发生在火球形成早期），
      而且必须**明显偏介质右侧**（cx≈0.60，cy≈0.45）：
      ★ 顶点偏哪边，哪一边的出射路径就短。能量损失 ∝ 穿过介质的路径长度，
        所以"顶点靠右"才是"朝右下的短、朝左下的长"的唯一画法。
        （旧版把顶点放在偏左下，算出来两条弦长刚好是反的：朝左下 0.09 画布宽就出射、
          朝右上反而 0.30 —— 3/3 草图都照抄了这个反的几何，见 CHANGELOG v2.7.2。）
    primitive: 小而亮的爆发星芒（几根短刺 + 亮核）
    params: {cx: 0.60, cy: 0.45}
    material: "亮黄白爆发（#fffdf0 → #ffe27a），尺寸小（半径约画布高的 3%），不要大光斑"
    z: 2

  - id: J1
    name: 未淬火喷注
    physics_role: >
      背对背两个喷注里**穿过介质路径短**的那一个（朝右上）——
      顶点本来就在介质右侧，所以它**在介质内只有很短的一段（≈0.04 画布宽）就出射**，
      大部分锥体画在介质外面。介质压制很小，末态是**准直、高 pT 强子多**的完整喷注。
    primitive: 从顶点出发的**准直锥**（越远越宽一点点），顶端一簇小圆球（强子）
    params: {from: [0.60, 0.45], to: [0.88, 0.30]}
    material: >
      深蓝色实心锥（#2f6fd0 → #1b3f8f，带球面明暗与描边），顶端 6~9 个浅蓝白小球
      （#dce8ff）成簇。整体**明亮、干净、准直**。
    z: 3

  - id: J2
    name: 被淬火喷注
    physics_role: >
      背对背的另一个喷注，朝左下、**穿过介质的路径长** —— 因为顶点在介质右侧，
      它要**几乎横穿整个介质（≈0.25 画布宽）**才出射，沿途通过胶子轫致辐射
      不断损失能量，出介质后变软、变暗、高 pT 强子明显减少。
      ★ 它与 J1 **严格背对背**（在图上近似 180°）。
      ★ 两条弦长之比必须 ≥1.8（长/短），这一条由闸口的机器检查量（不是靠看）。
    primitive: 同 J1 的锥，但在介质内一段**逐渐变暗、变宽、颜色偏灰**
    params: {from: [0.60, 0.45], to: [0.15, 0.65]}
    material: >
      锥体从深蓝**渐变为灰蓝→浅灰**（#2f6fd0 → #8fa0bb → #c9d2de），
      轮廓比 J1 模糊一档；顶端强子**只有 2~3 个小球且更暗**（#aab6c8）。
      与 J1 并排看必须一眼看出"这一侧被压低了"。
    z: 3

  - id: G1
    name: 胶子轫致辐射
    physics_role: >
      部分子在介质内辐射胶子 —— 这是能量损失的**机制**，必须画出来。
      辐射点只出现在**介质内部**、沿着 J2 的轨迹。
    primitive: 4~7 个黄绿色小光点 + 短短的螺旋/波纹线，越靠近介质边缘越少越小
    params: {along: J2, region: 介质内部}
    material: "亮黄绿 #ffe27a / #b6e33a，尺寸很小（半径约画布高的 0.8%），不要连成光带"
    z: 4

  - id: A1
    name: 束流方向
    physics_role: >
      介质沿**束流方向**拉长 —— 用一个竖直的双向箭头标出来。
    primitive: 竖直双向箭头（很短、细），画在**介质右侧偏下**的空隙处
      （x≈0.72、y 0.57~0.79；那里在蓝喷注下方、介质轮廓外，别压到任何对象）
    params: {cx: 0.72, cy: 0.68, dir: 竖直}
    material: "深灰 #2a2d33，细（arrow 线宽），不要与喷注混淆"
    z: 2

  - id: T1
    name: 顶点标签
    physics_role: "标注硬散射顶点"
    params: {text: "hard scattering", cx: 0.80, cy: 0.47}
    z: 5
  - id: T2
    name: 介质标签
    physics_role: "标注 QGP 介质"
    params: {text: "QGP medium", cx: 0.50, cy: 0.93}
    z: 5
  - id: T3
    name: 未淬火喷注标签
    physics_role: "标注短路径、未被压制的一侧"
    params: {text: "unquenched jet (short path)", cx: 0.86, cy: 0.12}
    z: 5
  - id: T4
    name: 被淬火喷注标签
    physics_role: "标注长路径、被压制的一侧"
    params: {text: "quenched jet (long path)", cx: 0.145, cy: 0.82}
    z: 5

composition:
  view: "斜视 3D 单幅场景；介质竖直拉长居中，两个喷注从顶点背对背飞向右上与左下"
  layout:
    - "介质椭球居中（cx≈0.50, cy≈0.47），占画布高度约 75%、**宽度约 25%**"
    - "  ★ 画布是 1.79:1 的宽幅：25% 宽 = 416px、75% 高 = 696px，高/宽≈1.67 才达标；"
    - "    若写成 34% 宽（旧稿）就只剩 1.15 —— 那是个圆胖形，不是「沿束流拉长」"
    - "硬散射顶点在椭球内**明显偏右**（cx≈0.60, cy≈0.45）—— 不许放中间、不许放偏左"
    - "两个喷注从顶点出发背对背，轴接近水平（约 ±25°，不要画成竖直）："
    - "  · 未淬火（蓝）朝右上到 (0.88,0.30)：在介质内只有很短一段就出射"
    - "  · 被淬火（灰）朝左下到 (0.15,0.65)：几乎横穿整个介质才出射"
    - "四个标签放在各自对象的**外侧空隙**，不许压到喷注或介质上"
  note: >
    ★ 这是**一张图讲一个机制**，不要加面板字母 (a)(b)，不要加外框，
    不要画坐标轴/网格背景，不要加 IR 里没有的对象（不要加探测器、不要加第三个喷注）。
    ★ 画布 1664×928；背景纯白；上下左右留白均匀。

geometry_constraints:
  机器:
    - 名: 喷注路径不对称（弦长比）
      长路径色: gray      # gray = 低饱和那一侧的锥（被淬火）；画反了就报错
      阈值: 1.8           # 长 / 短 ≥ 它才算成立
  约束:
    - 名: 两个喷注严格背对背
      量: "两条锥轴之间的夹角"
      要求: "180° ± 15°"
      为什么: 双喷注来自同一个硬散射顶点，动量守恒 → 背对背。
    - 名: 硬散射顶点在介质内部且偏右
      量: "顶点的像素位置是否落在介质椭球内、且在椭球中心的右侧"
      要求: "成立（内部 cx≈0.60 明显偏右，不贴边、不在椭球外）"
      为什么: 这张图讲的正是"部分子要穿过介质才能逃逸"。
    - 名: 两侧介质路径长度不同且"左下长、右上短"
      量: "沿两条喷注轴，落在介质掩膜内的弦长（★ 闸口已实现机器自动量，见 机器 段）"
      要求: "J2 的弦长 > J1 弦长的 1.8 倍"
      为什么: 能量损失 ∝ 路径长度；两侧一样长就讲不出"不对称"。
    - 名: 被淬火一侧明显更弱
      量: "两侧喷注锥的平均亮度/饱和度；顶端强子小球个数"
      要求: "J1 更亮更饱和、强子 ≥6 个；J2 更暗更灰、强子 ≤3 个"
      为什么: 这是图要传达的唯一结论。
    - 名: 胶子辐射只在介质内、只沿长路径一侧
      量: "黄绿光点是否落在介质椭球内且靠近 J2 轴"
      要求: "全部落在介质内；J1 一侧没有"
      为什么: 能量损失发生在介质里。
    - 名: 介质是竖直拉长的椭球
      量: "介质掩膜的 高/宽 比"
      要求: "≥ 1.6"
      为什么: 介质沿束流方向（竖直）拉长。

style:
  classification: 半写实插画
  evidence: >
    照 T3-02 那条线：形体是 3D 椭球/锥体，体积感来自球面明暗 + 描边，
    介质半透明可看穿；不是平涂。
  palette:
    介质: "#ffd257 → #f08a2a → #d9451f（半透明）"
    未淬火喷注: "#2f6fd0 → #1b3f8f；顶端强子 #dce8ff"
    被淬火喷注: "#2f6fd0 → #8fa0bb → #c9d2de；顶端强子 #aab6c8"
    胶子辐射: "#ffe27a / #b6e33a"
    顶点: "#fffdf0 → #ffe27a"
    线/箭头/文字: "#2a2d33"
    背景: "#ffffff"
  line_widths: {outline: 1.6, arrow: 2.6, mesh: 0.9}
  fonts: {latin: "DejaVu Sans", size_steps: [14, 16, 18]}
  conventions:
    - "介质必须**半透明**，能看见里面的顶点、喷注轨迹与辐射点"
    - "介质竖直拉长（束流方向竖直），明显不是圆球"
    - "两个喷注**背对背**，都从同一个顶点出发，锥形准直"
    - "被淬火一侧（左下）明显更暗更灰、强子更少；两侧并排看必须一眼看出差别"
    - "胶子辐射是**小光点/短波纹**，只在介质内、只沿左下那侧，不要连成光带、不要撒满"
    - "视角固定：斜视 3D，不要正侧视、不要俯视"
    - "★ 两条喷注轴接近**水平**（各偏离水平约 ±25°），一左一右；"
    - "  不要画成一上一下、不要画成竖直 —— 介质是竖着的，路径长短就是在这条近水平轴上比的"
    - "★ 顶点必须落在介质内**偏右**：左边那条（被淬火）要**明显更长**，"
    - "  长/短 ≥ 1.8；两条一样长或左短右长 = 把物理讲反了"
    - "文字拼写必须完全正确：hard scattering / QGP medium / unquenched jet (short path) / quenched jet (long path)"
    - "★ 不要画外框、不要画面板字母 (a)(b)、不要画坐标轴或网格背景"
    - "★ 背景纯白，不要渐变背景、不要阴影地面、不要装饰性光晕"

execution:
  primary: imagegen
  reason: >
    风格轴：半写实 3D 插画（半透明介质 + 锥形喷注 + 球面明暗）→ 生图模型比手写
    SVG 省力；物理轴由 geometry_constraints 约束，两道闸口把住。
  fallback: [svg]
  rejected:
    - tool: matplotlib
      reason: "无数据、无坐标轴"
    - tool: blender
      reason: "形体是示意性的椭球/锥体，不需要真实 3D 几何与真实光照"
  portability: "figure + elements + composition 三层完全后端无关"

assertions:
  machine:
    - "M1、V1、J1、J2、G1、A1、T1..T4 全部存在"
    - "导出矢量且文字可提取；最小字号 ≥5pt"
    - "嵌入位图 0 个"
  human:
    - "物理正确：背对背喷注、顶点在介质内、长路径一侧被压低、辐射只在介质内"
    - "视觉达到可投稿水平"