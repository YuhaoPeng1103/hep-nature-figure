figure:
  id: qgp-jet-paper-3d
  title: Jet quenching in the quark-gluon plasma
  physics_claim: A hard-scattered back-to-back parton pair crosses unequal path lengths through the QGP; the long-path jet loses energy and radiates.
  target_journal: Nature
  canvas:
    width_mm: 183
    height_mm: 100

style:
  mode: render3d
  classification: 3D vector diorama
  evidence: One axonometric camera, one lighting direction, article-derived nuclei and QGP, and code-reconstructed paper jet tracks.
  background: "#ffffff"
  palette:
    mode: semantic
    families: [neutral, orange, red, blue, cyan, green]
  fonts:
    family: "DejaVu Sans"
    size_steps_pt: [6, 7, 8, 10]

composition:
  renderer:
    type: direct-svg
    script: assets/examples/direct-svg/qgp_jet_paper_3d.py
  projection:
    type: 斜二测
    类型: 斜二测
    axes_deg: {x: 30, y: -90, z: 0}
    轴方向_deg: {x: 30, y: -90, z: 0}
    foreshortening: {x: 0.72, y: 1.0, z: 1.0}
    前缩: {x: 0.72, y: 1.0, z: 1.0}
  coordinates:
    handedness: right
    beam_axis: z
    reaction_plane: xz
  坐标约定:
    面内: [x, z]
    法线: y
    手性: 右手
    束流轴: z
  layout:
    template: single-panel-3d-diorama
    regions:
      - id: collision_scene
        x_range_mm: [3, 180]
        y_range_mm: [10, 96]
        objects: [incoming_left, incoming_right, medium, escaped_jet, quenched_jet]
    alignment:
      incoming_axis: horizontal
      incoming_objects: [incoming_left, incoming_right]
      incoming_symmetry_about: medium
      jets: back_to_back_about_vertex
      jet_objects: [escaped_jet, quenched_jet]
      jet_origin: medium
      labels: outside_object_bbox

elements:
  - id: incoming_left
    name: Pb nucleus moving toward the collision
    asset: article_t302_shape_06
    render_mode: texture
    fit: contain
    physics_role: Incoming heavy nucleus reconstructed from the STAR nuclear-shape figure.
    x_mm: 34.8
    y_mm: 52.3
    width_mm: 33.8
    height_mm: 28.8
    rotation_deg: -8
    z: 3

  - id: incoming_right
    name: Pb nucleus moving toward the collision
    asset: article_t302_shape_06
    render_mode: texture
    fit: contain
    physics_role: Second incoming heavy nucleus reconstructed from the STAR nuclear-shape figure.
    x_mm: 149.6
    y_mm: 52.3
    width_mm: 33.8
    height_mm: 28.8
    rotation_deg: 8
    z: 3

  - id: medium
    name: Electromagnetic QGP fireball
    asset: article_t330_qgp_fireball
    render_mode: edit
    fit: contain
    physics_role: Hot deconfined medium with the hard-scattering origin.
    x_mm: 92.2
    y_mm: 52.3
    width_mm: 63.6
    height_mm: 52.1
    z: 5

  - id: escaped_jet
    name: Escaping jet
    asset: article_prl125_qgp_jet_scene
    render_mode: edit
    fit: contain
    physics_role: Short-path jet that exits with most of its energy.
    x_mm: 133.9
    y_mm: 40.0
    width_mm: 58
    height_mm: 40
    rotation_deg: -36
    z: 7

  - id: quenched_jet
    name: Quenched jet
    asset: article_prl125_qgp_jet_scene
    render_mode: edit
    fit: contain
    physics_role: Long-path jet with energy loss and medium-induced radiation.
    x_mm: 69.0
    y_mm: 76.0
    width_mm: 56
    height_mm: 30
    rotation_deg: 144
    z: 7

texts:
  - {id: title, value: "Jet quenching in the quark–gluon plasma", x_mm: 91.5, y_mm: 7, font_size_pt: 8, anchor: middle, color: "#222830"}
  - {id: label_left_pb, value: "Pb", x_mm: 34.8, y_mm: 74, font_size_pt: 7, anchor: middle, color: "#20242a"}
  - {id: label_right_pb, value: "Pb", x_mm: 149.6, y_mm: 75, font_size_pt: 7, anchor: middle, color: "#20242a"}
  - {id: label_escape, value: "Escaping jet", x_mm: 145.8, y_mm: 17, font_size_pt: 7, anchor: middle, color: "#155b93"}
  - {id: label_quench, value: "Quenched jet", x_mm: 61, y_mm: 94, font_size_pt: 7, anchor: middle, color: "#52606e"}
  - {id: label_qgp, value: "QGP medium", x_mm: 134.6, y_mm: 77.5, font_size_pt: 7, anchor: middle, color: "#c7431d"}
  - {id: label_hard, value: "hard scattering", x_mm: 132.0, y_mm: 64.0, font_size_pt: 7, anchor: middle, color: "#3c4650"}

relationships:
  - id: R1
    type: contains
    subject: escaped_jet
    object: medium
    statement: The bright jet crosses the short chord of the QGP.
  - id: R2
    type: contains
    subject: quenched_jet
    object: medium
    statement: The gray radiating jet crosses the long chord of the QGP.

hard_physics:
  - id: HP1
    claim: The incoming nuclei approach the collision region from opposite directions.
    measure: dot(v_left, v_right) < 0.
    verification: machine
    check: {type: opposite_rays, origin: medium, a: incoming_left, b: incoming_right}
  - id: HP2
    claim: The two jets are back-to-back about the hard-scattering region.
    measure: 150 deg <= angle(v_escape, v_quench) <= 210 deg.
    verification: machine
    check:
      type: angle_between_rays
      origin: medium
      a: escaped_jet
      b: quenched_jet
      min_deg: 150
      max_deg: 210
  - id: HP3
    claim: The quenched jet crosses a longer medium chord.
    measure: path_quenched / path_escape > 1.5.
    verification: human
    note: Confirm visually that the quenched track remains inside the medium farther than the escaping track.
