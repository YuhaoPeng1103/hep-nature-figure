# ---------------------------------------------------------------------
# 构图层：视角、分区、相对坐标、叠放关系
# ---------------------------------------------------------------------
composition:
  canvas:
    ratio: "约 1.32（横版，833 x 633 px）"
    用途: "单栏或双栏整幅示意图（论文 Figure 1 级别）"

  视角: >-
    两个分区用了两种不同的"视角"，这是本图最关键也最容易做错的构图特征：
    (1) 左侧两个小图是**纯 2D 正视图**：没有任何透视，n̂ 严格竖直，衰变轴在一个平面内。
    (2) 右侧是**斜投影（oblique / pseudo-3D）而非真透视**：反应平面画成一个严格的
        平行四边形（两组对边平行等长，T(0.527,0.196) R(0.912,0.243) B(0.685,0.703)
        L(0.300,0.656)），消失点在无穷远。
    可以证明这不是一致的投影：三根坐标轴在画布上的方向为
    z = 右上 60°、x = 水平向右、y = 竖直向下，若按正交投影反解，
    三个轴两两垂直的条件互相矛盾（得不到实的视线方向）。
    所以 y 轴"竖直向下"是画图约定（表示"垂直纸面向观察者一侧"），不是几何投影，
    实现时必须照抄这个约定，而不是去算一个正确的 3D 投影。
    z 轴被画短（foreshortening），与 x、y 同量级，属"柜式投影"习惯。
    火球是一个 3D 体元（发光延伸到平面上下两侧），它**不受平面裁剪**。

  分区: >-
    画面横向分成两块：左侧 0 ~ 0.26 画布宽为"运动学小图列"，
    上下排列两个同构的小图（A: phi，y 0.06-0.40；B: K*0，y 0.44-0.79），
    两图结构完全同构（同一根 n̂、同样的 theta*、同样的椭圆+双球+弹簧），
    只有末态标签与第二球的颜色不同；
    右侧 0.26 ~ 1.0 画布宽为 3D 场景（网格平面 + 火球 + 旁观者 + 坐标架 + 标注），
    占据画面的主体。两块之间不重叠，图上也没有分隔线或面板编号（无 (a)(b) 标号）。
    整幅图没有坐标轴刻度、图例或数据，是纯示意图。

  元素布局:
    - id: E1
      锚点: [0.606, 0.450]
      相对尺寸: "四角 T(0.527,0.196) R(0.912,0.243) B(0.685,0.703) L(0.300,0.656)，外接 0.61 画布宽 x 0.51 画布高"
      备注: "尺寸指的是平面四角的连线范围；平面本身无厚度"
    - id: E2
      锚点: [0.440, 0.620]
      相对尺寸: "长约 0.21（沿走向）、宽约 0.05 画布宽"
      备注: "另一条镜像条带锚点 [0.770, 0.240]，长约 0.16"
    - id: E3
      锚点: [0.588, 0.395]
      相对尺寸: "总尺寸（含弥散到不可见的边缘）约 0.42 画布宽 x 0.54 画布高"
      备注: "★ 这是「含弥散」的总尺寸，不是核心尺寸；核心尺寸见 E4。实现时若按核心半径缩放，火球会大出一倍"
    - id: E4
      锚点: [0.580, 0.394]
      相对尺寸: "核心（高饱和橙区）约 0.21 画布宽 x 0.38 画布高"
      备注: "与外晕同心；外晕/核心直径比约 2.0（横向）"
    - id: E7
      锚点: [0.560, 0.400]
      相对尺寸: "单球直径 0.018~0.032 画布宽；整群占 x 0.40-0.72、y 0.20-0.62"
      备注: "球的大小分 3 档；约 7~9 个可见集团"
    - id: E9
      锚点: [0.395, 0.615]
      相对尺寸: "0.058 画布宽 x 0.130 画布高（左簇）"
      备注: "右簇锚点 [0.777, 0.259]，尺寸 0.054 x 0.114；两簇沿平面对角线分布，长轴都沿束流方向（约 60°~70°）"
    - id: E10
      锚点: [0.664, 0.690]
      相对尺寸: "z 轴长约 0.10 画布高、x 轴长约 0.09 画布宽、y 轴长约 0.10 画布高"
      备注: "三个轴的画布方向：z 右上 60°、x 水平向右、y 竖直向下"
    - id: E11
      锚点: [0.598, 0.200]
      相对尺寸: "总长约 0.17 画布高（杆 0.14 + 头 0.035），头宽 0.052 画布宽，杆宽 0.024 画布宽"
      备注: "尖端 y=0.126，箭尾视觉上没入火球于 y≈0.30"
    - id: E12
      锚点: [0.816, 0.177]
      相对尺寸: "长约 0.055 画布宽"
      备注: "另一个锚点 [0.366, 0.720]，长约 0.060；两者方向相反（一个指右上、一个指左下）"
    - id: E14
      锚点: [0.169, 0.150]
      相对尺寸: "n̂ 轴长 0.163 画布高（y 0.068-0.231）"
      备注: "E20 的 n̂ 轴同长（y 0.446-0.608），两轴共线于 x≈0.17"
    - id: E16
      锚点: [0.174, 0.262]
      相对尺寸: "长轴 0.060 画布宽（含描边），短轴 0.038"
      备注: "E22 锚点 [0.174, 0.640]，同尺寸"
    - id: E15
      锚点: [0.170, 0.261]
      相对尺寸: "单支箭头长约 0.15 画布高"
      备注: "两条箭头以锚点为中点严格反向；E21 同构，锚点 [0.170, 0.638]"

  叠放关系: >-
    (1) 右侧场景自后向前：平面网格 E1 → 青色拖尾 E2 → 火球外晕 E3 → 火球亮核 E4；
        关键：火球与外晕对网格用的是「正片叠底」式的叠加，所以网格线穿过火球时
        表现为**深橙色**而不是被完全盖住——网格的线在火球里仍看得见，这一点必须复现。
        火球不受平面裁剪，其发光延伸到平面的上方与下方（平面外的部分是火球在平面前后的体元）。
    (2) 火球之上：强子化集团圆盘 E5 → 胶子线 E6 → 强子球 E7 → 小椭球 E8。
        球体和胶子线全都压在火球渐变之上（球是满饱和、带高光的，没有被火球染色）。
    (3) 旁观者簇 E9 压在拖尾 E2 之上，且不参与火球的叠加（灰球保持橄榄灰，不被染橙）。
    (4) 坐标三轴 E10 位于场景右下角、压在平面之上（黑线在平面上清晰可辨）。
    (5) L̂ 大箭头 E11 压在火球之上、但**被强子球 E7 压住**——检查火球中心附近，
        与箭杆重叠的球体仍保持完整的高光与饱和色（例如箭杆 x≈0.598 处、
        y≈0.30 的蓝色球），说明粒子画在箭头之后。箭头不遮挡任何粒子。
    (6) 标注块箭头 E12 与所有文字 E13 在最顶层，不与任何物理图元构成遮挡歧义。
    (7) 左侧两个小图内部：n̂ 轴与 theta* 弧 E14/E20 → 两条动量箭头 E15/E21 →
        介子椭圆 E16/E22（椭圆**盖住**了 n̂ 轴的下端和两条动量箭头的中间段，
        箭头的可见部分在椭圆两侧断成两截）→ 夸克球 E17/E23 → 胶子线 E18/E24 → 文字 E19/E25。
    (8) 左右两个分区互不重叠，它们之间的相对 z 序在图上不可判定，也不影响结果；
        本 IR 按"右侧场景在后、左侧小图在前"排列，实现时顺序无关紧要。

# ---------------------------------------------------------------------
# 风格层：分类（驱动选型）+ 判据 + 执行参数
# ---------------------------------------------------------------------
style:
  classification: 矢量插画
  evidence: >-
    (1) 全图所有球体（强子球、夸克球、旁观者球）共用同一套"径向渐变 + 左上偏置的
        白色圆斑高光 + 一圈略深的描边"，高光位置逐球一致（约 10 点钟方向），
        说明明暗是**画出来的**固定渐变，而不是由光照模型算出来的——若为渲染，
        不同位置的球高光方向会随法线/环境变化，且会有互相反射与环境遮蔽。
    (2) 无任何材质纹理：没有噪声、没有粗糙度变化、没有金属/塑料的材质区分，
        球与球之间只有颜色差异。
    (3) 没有景深、没有环境反射、没有真实阴影投射（旁观者簇在平面上不投影）。
    (4) 火球的"发光"是一个二维径向渐变 + 软边（可用高斯模糊滤镜复现），
        不是体积散射；平面网格是线宽一致的 1 px 均匀细线。
    (5) 标注块箭头是线性渐变的平涂块面 + 细描边，是典型的矢量插画构件。
    综合：属于**矢量插画**（偏写实的一端——因为它用了柔和渐变和发光，
    但仍然"无材质、无真实光照"）。它不是"半写实插画"：判据是半写实需要有
    质感与光影层次（如表面粗糙度、真实反射、柔和阴影），本图完全没有；
    它也不是"照片级渲染"：无真实材质与景深。
  characteristics:
    - 平涂 + 线性/径向渐变（球体、块箭头、火球）
    - 统一方向的固定高光（画出来的，非算出来的）
    - 无材质纹理、无景深、无投影阴影
    - 细而统一的描边（网格 1 px、椭圆与块箭头 2 px）
    - 无衬线正文字体，纯黑标注，无图例无刻度
    - 唯一的"工程制图"元素是坐标三轴（纯黑细线 + 实心小箭头）
  palette:
    背景: "#ffffff"
    火球外晕: "#f0cfc4 -> #ecb6a5"
    火球中层: "#ef774f"
    火球核心: "#fa6415 / #f8631b"
    平面填充: "#ffffff（近白，略透）"
    平面网格线: "#717171"
    强子球_红: "#f34238 -> #a81c1c"
    强子球_蓝: "#4a86d8 -> #1e4f96"
    强子球_绿: "#5dde37 -> #2f7d1a"
    强子球_深色: "#3a2b28 -> #80352b"
    强子球_橙: "#ef8b4a"
    旁观者球: "#c3c5ad（暗部 #505442）"
    青色拖尾: "#c9f0ea"
    动量箭头_钢蓝: "#4e81bd"
    L̂箭头: "#3bb7eb -> #7fd3f2（杆为白->透明）"
    注解块箭头: "#c4c8ce -> #7391b8 -> #556e91"
    介子椭圆: "描边 #f9c699，填充 #f4fff4"
    胶子线: "#939e89（深部 #5c6b58）"
    坐标轴与文字: "#000000"
  line_widths:
    grid: 1.0
    axis: 1.5
    meson_ellipse: 2.0
    momentum_arrow: 2.0
    gluon_line: 1.2
    emphasis: 0
    备注: "无粗外轮廓；全图靠渐变与颜色区分层次，不靠描边粗细"
  fonts:
    latin: "DejaVu Sans / Arial 类无衬线"
    cjk: "Noto Sans CJK（若需中文标注）"
    size_steps: [10, 12.5, 16, 20, 24]
    备注: "正文标注约 20~24 px（画布 833 px 宽时），轴标签带数学斜体与下标"
  conventions:
    - "矢量符号 p⃗ 用 'p + 组合上箭头 U+20D7'，不要用图片或手绘线"
    - "n̂ / L̂ 用 'n + 组合顶帽 U+0302'，L̂ 为斜体 L + 顶帽"
    - "下标（K+、pi-、beam）用 dy 偏移 + 绝对字号，不用 baseline-shift"
    - "L̂ 与 theta* 的 * 用上标位置字符，不参与正文字号"

# ---------------------------------------------------------------------
# 执行层：后端选择（内容轴 x 风格轴）+ 否决理由 + 换风格的迁移路径
# ---------------------------------------------------------------------
execution:
  primary: svg
  reason: >-
    内容轴：这张图是**示意图**——没有任何数据、坐标轴刻度、图例或统计表达，
    所有的形状（箭头、球、平面、弹簧）都是"表达手段"而不是"科学内容本身"；
    几何是人为规定的（斜投影约定，而非真实 3D 几何）。
    依选型规则"形状是表达手段 → svg"。
    风格轴：矢量插画（依据见 style.evidence）→ 指向 svg/illustrator。
    两条轴一致指向同一后端，故 primary = svg。
    可实现性核对：本图需要的三种"非平凡"效果 SVG 都能原生做到——
    (a) 球体的立体感 = <radialGradient> + 偏移焦点 fx/fy 做高光；
    (b) 火球的弥散发光 = <radialGradient> + <filter><feGaussianBlur>；
    (c) 火球穿透网格的"深橙网格线" = 火球层 mix-blend-mode: multiply（或给网格线
        单独做一层差值叠色）。这三点是本图最容易被做错的地方，必须在实现时显式指定。
  style_switch: >-
    若风格改为「半写实科学插画」（要求有质感与光影层次、真实光照、材质区分），
    同一份 figure + elements + composition 应改用 blender(toon/PBR) 或 imagegen；
    **前三层（figure / elements / composition）一个字段都不用改**，
    需要改的只有 style 层（palette/line_widths 换成材质与光照参数）与 execution 层。
    若风格改为「照片级渲染」，则用 blender，并且 composition 里"斜投影约定"
    需要升级为真实相机参数（因为照片级风格下观众会期待一致的透视）——
    这是少数连 composition 都要动的例外，原因来自风格而非内容。
    若风格改为「扁平信息图」，仍用 svg，但去掉全部渐变与发光。
  fallback: [illustrator, matplotlib]
  rejected:
    - tool: blender
      reason: >-
        风格轴不符——blender 默认产出的是真实光照/材质的渲染，本图所有球体高光方向
        完全一致且无环境遮蔽与投影阴影，是"画出来的"矢量插画；用 blender 会做出
        "更真但不一样"的图（风格轴错），且 2D 文字与数学标注（p̂_beam、-L̂、theta*）
        在 blender 里排版代价极高。另外内容轴也不需要真 3D：平面的"斜投影"
        本身不自洽，说明作者并不想要一个几何正确的 3D 场景。
    - tool: imagegen
      reason: >-
        随机采样，无法保证与参考图逐结构一致：球体数量与位置、两个旁观者簇的位置、
        L̂ 与 y 轴的反向关系、左侧两个小图的同构关系都可能被采样破坏。
        对物理示意图来说，"画错一个箭头方向"就是物理错误，不可接受。
    - tool: matplotlib
      reason: >-
        无原生渐变球体、无混合模式、无软边发光；用 imshow 拼贴会栅格化，
        违背"导出为矢量、文字可提取"的验收要求。数学标注（mathtext）虽可用，
        但整体风格做不到矢量插画。
    - tool: tikz
      reason: >-
        能力上可行（球体用 shadings，火球用 fadings），但正片叠底的网格穿透、
        软边模糊与渐变块箭头的实现成本高，且后续人工精修不便；
        在有 svg 这一更自然的选择时不作为首选（仅在必须进 LaTeX 排版时才考虑）。
  portability: >-
    figure 与 elements 两层完全后端无关：换到 Blender / Illustrator / TikZ 时，
    physics_claim、physics_role、z 序、primitive 描述均不变。
    composition 层里的"斜投影约定"与"含弥散的尺寸"这两条是本图最容易被后端实现者
    误读的地方，换后端时仍必须原样传递。

