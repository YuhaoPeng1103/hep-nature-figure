# =====================================================================
# 诚实记录：困难点与不确定处
# =====================================================================
#
# 【一、直接从图上就能看出来的（无需物理知识）】
#   - 图面结构：左侧两个纵向排列的小图 + 右侧一个大场景；两块不重叠。
#   - 左侧每个小图 = 一根竖直黑箭头 + 两条背对背的蓝箭头 + 一个包着两个球和一段
#     弹簧线的椭圆 + 若干文字。两条蓝箭头严格以椭圆中心为中点反向（量过中点，
#     误差 < 2 px），这一点从图上直接可量。
#   - 右侧 = 一个平行四边形网格面 + 中心橙色发光团 + 团内许多彩色小球 + 少量
#     绿色弹簧线 + 团内若干浅色半透明圆盘 + 两个橄榄灰球簇 + 一个黑色三轴 +
#     一根向上大箭头 + 两个蓝色块箭头 + 若干文字。（数量：彩色球连通域 >= 25，
#     弹簧线约 10~14 段，浅色圆盘约 6~8 个，旁观者每簇 20~30 个球。）
#   - 两个小图结构同构，差异仅在末态标签（K- vs pi-）和第二个球的颜色（红 vs 绿）。
#   - 颜色、坐标、尺寸：见 composition 层，均为像素量测结果（833x633 画布）。
#   - 三轴在画布上的方向（z 右上 60°、x 水平、y 竖直向下）可直接量出；
#     并可证明它不是一致的正交投影（三轴两两垂直的条件互相矛盾），
#     因此"y 竖直向下"是画图约定。这一条是纯几何结论，不需要物理。
#
# 【二、靠物理知识推断的（若不懂物理，纯看图会得到什么错误理解）】
#   - 左图的椭圆 + 两球 + 弹簧 = 一个介子的夸克-反夸克束缚态。
#     纯看图会以为那是"两个球被一根弹簧连着"的抽象装饰；实际弹簧是胶子/色场管
#     的标准符号，两球是夸克与反夸克。不懂这个符号体系，会把这张图理解成弹簧振子
#     或机械装置。
#   - 小图 B 的第二个球是绿色（其余球是红色），这不是"随机配色"，而是用来标记
#     奇异夸克 s（phi = s s-bar 全红；K*0 含一个 s，故有一个绿球）。
#     纯看图只会觉得"颜色不一样"，看不出这是味道量子数的标记。
#   - theta* 不是普通几何角：它是矢量介子**静止系**里衰变产物动量相对量子化轴 n̂
#     的极角，是自旋密度矩阵元 rho00 唯一进入的观测量角度。纯看图只会说
#     "一个标了角度的夹角"，不会知道这是全局自旋排列的核心观测量。
#   - n̂ 与 y 轴的关系：右图把竖直向下的轴明确标成 y(-L̂)，而左图的 n̂ 画成竖直向上
#     ——两者反向。若不懂物理，很容易判为"图上画矛盾了"，进而"修正"成同向，
#     那就是实打实的物理错误。真实含义是：y 轴按约定取 -L̂ 方向，而量子化轴 n̂
#     取反应平面法向（本图约定它与 L̂ 同向）。
#   - L̂ 大箭头不是"指向上方的装饰箭头"：它代表碰撞的全局轨道角动量，
#     是自旋排列现象的成因（涡度/角动量把自旋沿法向定向）。去掉它或画反方向，
#     整张图的物理就没了。它从火球内部射出，也是刻意的：角动量由参与者区携带。
#   - 两个灰色球簇 = 旁观者核碎片（nuclear fragments），不是"另一类粒子"。
#     它们沿束流方向飞离、带走大部分纵动量；正因为它们不参与火球，
#     参与者区才有净的角动量。纯看图只会看到"两坨灰色小球"。
#   - 青色拖尾条带 = 旁观者物质沿束流方向的运动轨迹/拖尾（把"这两个簇是在
#     沿束流方向运动的"这件事画出来）。纯看图会以为那是"阴影"或"光晕"。
#   - 右图火球内的浅色半透明圆盘（内含 2~3 个小球和短弹簧线）= 强子化位点
#     （色单态强子集团正在形成），是把右图火球与左图"介子"联系起来的桥梁。
#     纯看图只会觉得那是"一团雾/一个光斑"。
#   - 网格平面 = 反应平面，而不是"一张坐标纸"；它把"束流方向与碰撞参数方向张成的
#     平面"这个抽象概念实体化了。
#   - 左右分区的内在联系：左图是"怎么量"，右图是"为什么会有自旋排列"。
#     纯看图会把它们当成两个不相干的图拼在一起。
#
# 【三、我没把握的（请老师确认）】
#   1. n̂ 的符号约定：本图把 n̂ 画成竖直向上（与 L̂ 同向），y 轴标 -L̂（向下）。
#      文献里对 n̂ = p_beam x b 与 L̂ 的相对符号有不同写法，我没有原始文献可核对，
#      只能"以图为准"地写 n̂ ∥ L̂。若原文约定的 n̂ 与 L̂ 反向，则左图的 n̂ 应指向下方。
#   2. 右侧青色条带的物理约定：轨迹拖尾 / 旁观者阴影区 / 束流走廊，三者我无法从图上
#      区分（图上无文字说明）。我按"沿束流方向的运动拖尾"写，尺寸与走向是量测的。
#   3. 火球的形状：量到的"核心"包围盒是 0.21 宽 x 0.38 高（明显竖长），而外晕是
#      0.42 x 0.54。这个竖长可能来自 (a) 火球被有意画成椭球，(b) 火球下半部分叠在
#      平面网格上导致我的颜色阈值在下半区失效，(c) 被 L̂ 箭杆的冷色区域切分。
#      我倾向于 (b)+(c) 有贡献，所以只把"总外晕 0.42 x 0.54"当作可靠数字，
#      核心的竖长形状存疑。
#   4. 平面网格的格数：约 6~8 条等间距线/方向，但我多次扫描（沿边取样）都没能得到
#      稳定计数——火球的橙色与网格的灰色在混合后对比度极低，且平面被火球和球簇遮挡
#      了约一半。这个数字我标为不确定，实现时按"等间距网格"处理即可，
#      格数不必强求精确。
#   5. 火球内 E8（浅褐色小椭球）的物理身份：尺寸明显小于主力强子球、对比度也低，
#      我推测是"更小的强子/集团残片"，但没有文字或图例支持；也可能它们只是
#      同一批强子球在远处的透视缩小。若两者其实是同一种东西，elements 应合并。
#   6. 粒子数量：彩色球连通域计数在火球高饱和区不可靠（相连的球会被并成一个连通域，
#      被火球染色的球会被漏检）。我给的"约 35~45 个"是目视计数，误差可能到 ±30%。
#      本图的物理表达不依赖精确粒子数，建议把它当成"数量级正确、位置大致分布正确"，
#      而不是逐个复刻。
#   7. 图底部的黑色文字残片（"...ametic view of the coordinate setup for measuring
#      global s..."）来自论文正文 caption 被截图裁切，不属于图本身；
#      我按"不复制"处理。若老师要求复现"带 caption 的成品"，那是另一份任务。
