# IR 标准答案 —— B3 (T3-07)
#
# 【来源说明】本文件是【盲测产出】，不是手写的。
#   建立方式：一个没有标准答案的 AI，只看参考图 + IR规范，独立提取。
#   为什么采用它：它比手写版**明显更完整**——
#     手写版 9 个元素，盲测版 25 个；盲测还找到了手写版完全漏掉的
#     胶子交换线、介子椭圆内的夸克球、旁观者拖尾条带、强子化圆盘。
#     它还做了几何反解（三轴方向、平行四边形四角坐标）。
#   手写版见 git 历史（已废弃）。
#
# ⚠️ 采用不等于全对。盲测自己在文件末尾列了 7 条不确定项，
#    其中「n̂ 的符号约定」是需要查原文才能定的**真实物理问题**，
#    不是 AI 的缺陷。使用本文件时那些存疑项必须一并考虑。
#
# ⚠️ 与其他标准答案的关系：
#    本文件粒度比 B1/B2 细得多。评分时用 score_ir.py 的**语义覆盖**，
#    不要用 1:1 元素匹配（粒度差会导致假阴性）。
#
# =====================================================================
# IR —— 高能核物理配图结构化中间表示
# 由参考图 /tmp/ir_blind/case2/figure.png 独立分析得到（blind 分析）
# 画布：833 x 633 px，横版，比例 1.316
# 坐标约定：归一化 [0,1]，x 向右，y 向下（与画布像素方向一致）
# =====================================================================

figure:
  id: case2-vector-meson-global-spin-alignment
  source: >-
    用户提供的论文配图截图。图片底部残留一行被裁切的黑色 caption 文字
    （可见片段："...ametic view of the coordinate setup for measuring global s..."，
    推断完整句为 "Schematic view of the coordinate setup for measuring global spin alignment"）。
    原文文献未给出，此处不作引用假设。图面物理内容指向矢量介子
    （phi -> K+ K-，K*0 -> K+ pi-）全局自旋排列（spin alignment, rho00）测量的坐标设置。
  physics_claim: >-
    这张图说明"测量矢量介子全局自旋排列时的坐标与运动学定义"：
    重离子非对心碰撞在反应平面（由束流方向 p_beam 与碰撞参数方向 b 张成）内产生一个
    热密 QGP 火球，旁观核子沿束流方向飞离；火球带有垂直于反应平面的全局轨道角动量 L̂。
    自旋量子化轴取反应平面法向 n̂（图上与 L̂ 同向画成竖直向上），
    介子自旋排列通过其两体衰变产物在介子静止系中相对 n̂ 的极角 theta* 的分布来测量，
    故 left 两个小图分别画出 phi -> K+ K- 与 K*0 -> K+ pi- 在 n̂-theta* 坐标下的运动学。
  archetype: 复合图（左：2 个纵向排列的 2D 矢量运动学小图；右：1 个 3D 场景示意图）
  panels_count: 3

# ---------------------------------------------------------------------
# 元素层：画序 = z 序，从后往前（先写的被后写的遮住）
# ---------------------------------------------------------------------
elements:

  # ---------- 右侧 3D 场景（后 -> 前）----------
  - id: E1
    name: 反应平面网格
    physics_role: >-
      反应平面（reaction plane）本身：由束流方向 p_beam（z）与碰撞参数方向 b（x）张成的平面。
      图中把它画成一块带网格的平行四边形薄板，是所有其它几何量的参照面——
      火球产生在这个面内，L̂ 垂直这个面向外，旁观者沿这个面内的束流方向飞走。
    primitive: 平行四边形面片（斜投影）+ 两个方向的等间距平行线网格 + 细边线
    params:
      四角: "T(0.527,0.196) R(0.912,0.243) B(0.685,0.703) L(0.300,0.656)"
      形状: "严格平行四边形（两组对边平行等长），非透视"
      网格: "两个方向各约 6~8 条等间距线（格距沿边约 0.04 画布宽），细浅灰线"
    material: "近白/极浅灰填充（alpha 很高），网格线 #717171 约 1px，边线略深"
    z: 1

  - id: E2
    name: 旁观者青色拖尾条带（左、右各一条）
    physics_role: >-
      两个旁观核碎片的束流方向（z）运动轨迹/拖尾。旁观者是未参与碰撞的那部分核物质，
      它们不参与火球的形成，而是沿束流方向继续飞出，所以在反应平面内留下一条
      从碎片簇指向火球方向的条带。物理上强调"火球只由参与者物质构成"。
      （注：条带的确切约定——是"轨迹"还是"未被火球覆盖的阴影区"——图上无文字说明，
       见文末困难点，此处按"沿束流方向的运动拖尾"理解。）
    primitive: 斜置的半透明条带（两端渐隐的线性渐变形）
    params:
      左条带: "中心 (0.44,0.62)，长约 0.21 画布高，宽约 0.05 画布宽，走向约 70°（左下->右上）"
      右条带: "中心 (0.77,0.24)，长约 0.16 画布高，宽约 0.048 画布宽，走向约 55°（右上->左下）"
    material: "淡青/薄荷色 #c9f0ea，半透明，长边方向两端透明度渐隐，压在网格之上"
    z: 2

  - id: E3
    name: QGP 火球弥散外晕
    physics_role: >-
      夸克-胶子等离子体（QGP）火球的辐射状"发光"外壳。它代表碰撞中心区形成的
      高温高密介质，其范围标定"参与者区"（participant zone）的大小。
      外晕不是几何边界，而是用发光来暗示火球是一个三维体元，且向平面两侧都延伸。
    primitive: 大半径径向渐变（圆/椭圆，中心最不透明，向外完全渐隐）
    params:
      中心: "(0.588,0.395)"
      总尺寸_含弥散边缘: "约 0.42 画布宽 x 0.54 画布高（按色差阈值 R-B>12 量到不可见边界）"
      形状: "略呈竖长（沿屏幕竖直方向比水平方向长）"
    material: "外缘 #f0cfc4 / #ecb6a5（浅粉橙）向内到 #ef774f；与下层做正片叠底，故网格线透出为深橙色"
    z: 3

  - id: E4
    name: QGP 火球亮核
    physics_role: >-
      火球的高温核心（能量密度最高的区域）。与外晕一起表达"中心最热、向外递减"，
      尺寸上代表碰撞重叠区（participant zone）的核心大小。
    primitive: 径向渐变（与外晕同心，半径更小、饱和度更高）
    params:
      中心: "(0.580,0.394)"
      核心尺寸: "约 0.21 画布宽 x 0.38 画布高（核心区，不含弥散；按高饱和橙的包围盒量得）"
    material: "由 #fa6415 / #f8631b（饱和橙红）向外过渡到与外晕衔接"
    z: 4

  - id: E5
    name: 强子化集团圆盘（半透明浅色圆盘，约 6~8 个）
    physics_role: >-
      强子化（hadronization / 色单态集团形成）的位点：火球膨胀冷却时，
      夸克-胶子在此重新组合成色单态的强子集团。圆盘内通常含 2~3 个小夸克球
      和短胶子线，正是"介子/重子正在形成"的图示。这一元素是把右图的火球
      与左图"矢量介子"联系起来的物理桥梁——介子就是在这样的集团里形成的。
    primitive: 半透明圆盘（软边圆形，内部含小球与短线）
    params:
      数量: "约 6~8 个"
      尺寸: "每个直径约 0.06~0.09 画布宽"
      分布: "散布在火球 x 0.40-0.72 / y 0.20-0.62 范围内"
    material: "比火球底色略亮的暖橙色，软边、低对比（靠 +8~12 的亮度差与软边区分）"
    z: 5

  - id: E6
    name: 胶子交换线（螺旋/锯齿线，约 10~14 段）
    physics_role: >-
      强相互作用的载体——胶子。画成螺旋/弹簧线是场论里胶子传播子的标准图示符号，
      在这里表示火球内部仍在进行的强相互作用（夸克之间的色场管），
      以及强子化时把夸克束缚成色单态的束缚力。
    primitive: 折线（约 3~5 个周期的锯齿/螺旋），线宽均匀，无填充
    params:
      数量: "约 10~14 段（含集团内部的短段）"
      单段长度: "约 0.02~0.04 画布宽"
    material: "深橄榄/灰绿 #939e89 ~ #5c6b58，细线，无描边高光"
    z: 6

  - id: E7
    name: 强子球（大/中/小发光球，约 35~45 个）
    physics_role: >-
      末态强子（final-state hadrons）。火球冻结后产生的粒子（π/K/p 等），
      不同颜色暗示不同种类/味道（绿球对应含奇异夸克的粒子，与左侧的 phi、K*0 呼应）。
      它们从火球内部飞出，是探测器最终测到的粒子；自旋排列测量用的 phi/K*0
      就出自这一批粒子中。
    primitive: 球（径向渐变球体 + 左上偏置的白色高光斑 + 轻微暗色描边）
    params:
      数量: "约 35~45 个（大球约 12~15 个，中小球约 25~30 个）"
      直径: "0.018~0.032 画布宽（15~25 px），大小分层"
      分布: "在火球内成团簇状分布，约 7~9 个较明显的集团 + 若干散点"
    material: "高饱和红 #f34238 / 蓝 #4a86d8 / 绿 #3fae1f / 深红黑 #3a2b28 / 橙 #ef8b4a；统一高光方向（约 10 点钟）"
    z: 7

  - id: E8
    name: 浅褐/橄榄色小椭球（约 15~25 个）
    physics_role: >-
      火球内体量更小、对比更低的一批粒子（小强子或正在形成的集团残片）。
      物理上与 E7 同类，只是尺度更小；图上用低对比、小尺寸与 E7 的"主力强子"区分，
      读图时应理解为背景粒子群而不是另一种物理对象。
      （没有文字直接说明，属推断，见文末困难点）
    primitive: 小扁椭球 / 浅色小环
    params:
      数量: "约 15~25 个"
      直径: "0.008~0.014 画布宽（7~12 px）"
    material: "浅褐 #c8b48a ~ 橄榄 #939e89，低对比，弱高光"
    z: 8

  - id: E9
    name: 旁观核碎片簇（左上、右下各一簇）
    physics_role: >-
      旁观者物质（spectator matter）——未参与碰撞的核子。它们带着几乎全部的
      初始纵动量沿束流方向飞出，形成"核碎片"（nuclear fragments）。
      在自旋排列/极化测量里至关重要的是：正因为旁观者带走了轨道角动量，
      参与者区（火球）才带有一个净的全局角动量 L̂，从而给介子自旋定向。
      两簇位于反应平面上沿束流方向的两个极端位置。
    primitive: 若干相切/相切的实心球堆成的团簇（不规则、松散的核团）
    params:
      数量: "每簇约 20~30 个可见小球，直径 0.012~0.02 画布宽"
      左簇: "中心 (0.395,0.615)，外接尺寸约 0.058 画布宽 x 0.130 画布高（沿束流方向拉长）"
      右簇: "中心 (0.777,0.259)，外接尺寸约 0.054 画布宽 x 0.114 画布高"
    material: "橄榄灰 #c3c5ad，暗部 #505442，与场景中彩色强子球明显区分（表示它们是核物质而非产生粒子）"
    z: 9

  - id: E10
    name: 事件坐标三面角（x, y, z 三个细箭头）
    physics_role: >-
      定义逐事件坐标系的三个轴，是整张图"坐标系设置"的直接答案：
      z 沿束流方向 p_beam（反应平面内），x 沿碰撞参数方向 b（反应平面内），
      y = -L̂（垂直反应平面，与 L̂ 反向）。所以 y 轴箭头指向下方而 L̂ 指向上方——
      两者反向是物理约定，不是画错。三轴的交点即碰撞中心/坐标原点。
    primitive: 三条细直线 + 实心小三角箭头
    params:
      原点: "(0.664,0.690)"
      z_端点: "(0.702,0.603)（即 p_beam，指向右上，画面上与水平约成 60°）"
      x_端点: "(0.753,0.692)（即 b，画面水平向右）"
      y_端点: "(0.666,0.790)（即 -L̂，画面竖直向下）"
      线宽: "约 1.5 px，黑色"
    material: "纯黑 #000000，无渐变，线宽统一（这是全图唯一「工程制图」式的元素）"
    z: 10

  - id: E11
    name: L̂ 大箭头（全局轨道角动量）
    physics_role: >-
      碰撞的全局轨道角动量 L̂，方向垂直于反应平面、指向画面上方。
      它是自旋排列现象的物理源头：L̂ 把介子自旋沿 n̂ 方向取向，
      使自旋密度矩阵的 rho00 偏离 1/3。箭头画成从火球内部射出，
      表示角动量由参与者区的物质携带。
    primitive: 块状实心箭头（宽矩形杆 + 三角头），竖直向上
    params:
      杆中心横坐标: "x = 0.598"
      箭头尖端: "(0.598,0.126)"
      箭头底部: "y ≈ 0.161；杆宽 0.024 画布宽（20 px）；头宽 0.052 画布宽（43 px）"
      长度: "杆的可见部分从 y≈0.30 到 0.161；其下没入火球渐变而「看不见」，视觉上等同于从火球中心射出"
    material: "箭头为浅蓝渐变 #3bb7eb -> #7fd3f2；箭杆为白/极浅蓝并向下逐渐透明（叠加在火球上仍偏冷色）"
    z: 11

  - id: E12
    name: 注解块箭头（两个，蓝色渐变）
    physics_role: >-
      纯标注指引元素，本身不是物理对象；其物理含义在于所指对象——
      一个指向左上方的旁观核碎片簇，一个指向右下方的旁观核碎片簇，
      说明这两簇灰球是"Nuclear Fragments"（旁观者核碎片），
      即区分"参与者（火球/彩色强子）"与"旁观者（灰球）"的图例。
      这一区分是全局极化/自旋排列物理的前提。
    primitive: 块状实心箭头（平行四边形杆 + 三角头），带线性渐变与细描边
    params:
      右上: "中心 (0.816,0.177)，长度约 0.055 画布宽，指向右上约 45°"
      左下: "中心 (0.366,0.720)，长度约 0.060 画布宽，指向左下约 -155°"
    material: "线性渐变 #c4c8ce -> #7391b8 -> #556e91（钢蓝），细深色描边"
    z: 12

  - id: E13
    name: 右侧场景的文字标注（7 组、共 8 处）
    physics_role: >-
      标注物理对象与物理量。每一条都在回答"这个图元在物理上是什么"，
      是图与物理之间的绑定关系，不可省略：
      "Quark-Gluon Plasma" 绑定火球；"Reaction Plane" 绑定网格平面；
      "Nuclear Fragments"（两处）绑定灰球簇；
      "z(p_beam)"、"x(b)"、"y(-L̂)" 绑定三个坐标轴并给出它们的物理定义。
    primitive: 文字串（含数学符号与下标：p̂_beam、b̂、-L̂）
    params:
      Quark-Gluon_Plasma: "两行，中心 (0.425,0.238)，字号约 17 px"
      Reaction_Plane: "单行，沿平面一条边旋转约 -55°（左下到右上），中心 (0.715,0.420)"
      Nuclear_Fragments_上: "两行，中心 (0.920,0.170)"
      Nuclear_Fragments_下: "两行，中心 (0.460,0.750)"
      z_p_beam: "中心 (0.770,0.635)"
      x_b: "中心 (0.760,0.720)"
      y_-L̂: "中心 (0.700,0.805)"
      L̂: "中心 (0.598,0.045)，位于大箭头正上方"
    material: "纯黑 #000000，无衬线正文体；数学符号用斜体 + 顶帽/箭头修饰"
    z: 13

  # ---------- 左侧小图 A：phi 介子衰变（后 -> 前）----------
  - id: E14
    name: 小图 A 的 n̂ 轴与 theta* 角弧
    physics_role: >-
      n̂ 是反应平面法向，也就是本测量所选的**自旋量子化轴**：矢量介子的自旋
      沿这个方向取投影，rho00 就是自旋投影 m=0 的占据概率。
      它竖直向上画，与右图的 L̂ 平行——即本图约定 n̂ 平行于 L̂（两者都垂直反应平面）。
      theta* 角弧标出"从 n̂ 起量"的极角，是自旋排列分析中唯一的观测量角度
      （W(cos theta*) = 3/4[(1-rho00) + (3 rho00 - 1) cos^2 theta*]），
      因此这条弧线的物理含义是"测量量的定义"，不是装饰。
    primitive: 细直线 + 实心小三角箭头（n̂）；圆弧（theta*）
    params:
      n̂轴: "x = 0.169，从 y 0.231 向上到 y 0.068（箭头尖端朝上）"
      theta弧: "圆心取介子中心，半径约 0.05 画布宽，从 n̂ 方向张到 K+ 方向"
      张角: "图上约 25°~27°"
    material: "n̂ 轴纯黑；theta* 弧为深灰细线"
    z: 14

  - id: E15
    name: 小图 A 的两条衰变动量箭头（p_K+ 与 p_K-）
    physics_role: >-
      phi 介子两体衰变 phi -> K+ K- 的两个末态动量。在介子静止系中两者严格反向，
      所以图上画成背对背、且以介子中心为中点——这正是"静止系中动量守恒"的图示。
      p_K+ 与 n̂ 的夹角即 theta*。K+、K- 用同一支箭头样式、只靠标签区分。
    primitive: 细直线 + 实心小三角箭头（两条，共线反向）
    params:
      K+箭头: "从介子中心 (0.170,0.261) 指向 (0.119,0.130)（左上）"
      K-箭头: "从介子中心 指向 (0.221,0.393)（右下）"
      夹角: "两条箭头共线反向（180°）"
      长度: "各约 0.15 画布高"
    material: "钢蓝 #4e81bd（与右侧 L̂ 的冷色呼应），线宽约 2 px，箭头实心"
    z: 15

  - id: E16
    name: 小图 A 的介子椭圆（phi meson 外框）
    physics_role: >-
      表示"这一个 phi 介子"本身（介子的静止系/有效体积的外框）。
      它把两个夸克球和之间的胶子线包在一起，强调介子是一个色单态束缚态；
      椭圆的取向沿衰变轴，暗示这是在同一静止系里看。
    primitive: 椭圆（长轴沿衰变轴，约 25° 偏离竖直）
    params:
      中心: "(0.174,0.262)"
      长轴: "约 0.060 画布宽（含描边），短轴约 0.038"
      倾角: "长轴方向与竖直成约 25°（沿 K+/K- 动量轴）"
    material: "填充极浅薄荷白 #f4fff4（半透明），描边浅橙 #f9c699，约 2 px"
    z: 16

  - id: E17
    name: 小图 A 内的两个夸克球（s 与 s-bar）
    physics_role: >-
      phi 介子的组分夸克：s 与 s-bar 夸克对（phi = s s-bar）。
      两个球用同一种色系（深红黑 + 亮红）表示同味道的正反夸克，
      是"这个介子由什么组成"的图示。它们与 E18 的胶子线一起给出介子的内部图像。
    primitive: 两个发光球（径向渐变 + 高光）
    params:
      深色球: "中心 (0.179,0.240)，直径约 0.019 画布宽"
      亮色球: "中心 (0.164,0.280)，直径约 0.021 画布宽"
      排布: "沿椭圆长轴（衰变轴）排列，被胶子线连成一体"
    material: "深球 #3a2b28 -> #80352b（暗红黑）；亮球 #f34238（正红）；高光白，光向左上"
    z: 17

  - id: E18
    name: 小图 A 内连接两夸克的胶子线
    physics_role: >-
      连接夸克对的色场管/胶子交换——即把 s 与 s-bar 束缚成 phi 介子的强相互作用。
      与火球中的胶子线是同一个符号，说明"介子内部的束缚"和"火球内部的强相互作用"
      是同一种物理。
    primitive: 短锯齿/螺旋折线（约 4 个周期）
    params:
      位置: "两球之间，中心约 (0.170,0.259)"
      长度: "约 0.022 画布宽"
    material: "灰绿 #939e89，细线，深色描边"
    z: 18

  - id: E19
    name: 小图 A 的文字标注
    physics_role: >-
      绑定物理量：phi meson 说明这是 phi 介子；p_K+ / p_K- 是末态动量；
      n̂ 是量子化轴；theta* 是被测角度。四者共同把"图上的一条线"变成
      "自旋排列分析里的一个量"。
    primitive: 文字（含矢量箭头符号 p⃗ 与上下标）
    params:
      phi_meson: "中心 (0.093,0.245)"
      p_K+: "中心 (0.095,0.135)"
      p_K-: "中心 (0.275,0.348)"
      n̂: "中心 (0.205,0.065)"
      theta*: "中心 (0.134,0.193)"
    material: "纯黑；矢量符号用带上横箭头，n̂ 用顶帽，theta 带上标 *"
    z: 19

  # ---------- 左侧小图 B：K*0 介子衰变（后 -> 前）----------
  - id: E20
    name: 小图 B 的 n̂ 轴与 theta* 角弧
    physics_role: >-
      与小图 A 完全相同的一根量子化轴 n̂（同一个反应平面法向），
      用于 K*0 的自旋排列测量。两个小图共用同一根 n̂ 方向，
      说明 phi 与 K*0 的自旋排列都是在同一个坐标架下比较的。
    primitive: 细直线 + 实心小三角箭头；圆弧
    params:
      n̂轴: "x = 0.170，从 y 0.608 向上到 y 0.446"
      theta弧: "圆心取介子中心，半径约 0.05 画布宽，张角约 25°~27°"
    material: "与 E14 相同（黑轴 + 深灰弧）"
    z: 20

  - id: E21
    name: 小图 B 的两条衰变动量箭头（p_K+ 与 p_pi-）
    physics_role: >-
      K*0 介子两体衰变 K*0 -> K+ pi- 的末态动量，同样背对背以体现静止系中动量守恒。
      注意这里两个末态粒子是**不同的**（K+ 与 pi-），与图 A 的两个同种粒子
      （K+ 与 K-）形成对照——这正是两类介子自旋排列测量的差异所在。
    primitive: 细直线 + 实心小三角箭头（两条，共线反向）
    params:
      K+箭头: "从介子中心 (0.170,0.638) 指向 (0.120,0.507)（左上）"
      pi-箭头: "从介子中心 指向 (0.220,0.768)（右下）"
      夹角: "两条箭头共线反向（180°）"
    material: "与 E15 相同（钢蓝 #4e81bd）"
    z: 21

  - id: E22
    name: 小图 B 的介子椭圆（K*0 meson 外框）
    physics_role: 表示"这一个 K*0 介子"本身的束缚态外框，作用与 E16 相同。
    primitive: 椭圆（长轴沿衰变轴）
    params:
      中心: "(0.174,0.640)"
      长轴: "约 0.060 画布宽，短轴约 0.038"
      倾角: "长轴与竖直成约 25°"
    material: "填充极浅薄荷白 #f4fff4，描边浅橙 #f9c699"
    z: 22

  - id: E23
    name: 小图 B 内的两个夸克球（s 与 d-bar）
    physics_role: >-
      K*0 介子的组分夸克：s 与 d-bar（K*0 = d s-bar 类组态）。
      关键的物理信息在**颜色**上：这里有一个绿球，对应奇异夸克 s；
      与小图 A 里两个红色球（s s-bar）形成对照。
      奇异夸克的存在是这两类介子自旋排列差异的物理根源之一。
    primitive: 两个发光球（径向渐变 + 高光）
    params:
      深色球: "中心 (0.179,0.616)，直径约 0.019 画布宽"
      绿球: "中心 (0.170,0.643)，直径约 0.021 画布宽"
      排布: "沿椭圆长轴（衰变轴）排列"
    material: "深球 #3a2b28 -> #80352b（同图 A）；第二球为绿色 #3fae1f（对应 s 夸克）"
    z: 23

  - id: E24
    name: 小图 B 内连接两夸克的胶子线
    physics_role: 同 E18——把夸克对束缚成 K*0 介子的色场管/胶子交换。
    primitive: 短锯齿/螺旋折线
    params:
      位置: "两球之间，中心约 (0.172,0.630)"
      长度: "约 0.022 画布宽"
    material: "灰绿 #939e89，细线"
    z: 24

  - id: E25
    name: 小图 B 的文字标注
    physics_role: >-
      绑定物理量：K*0 meson 说明介子种类；p_K+ / p_pi- 是末态动量；
      n̂ 与 theta* 同图 A。与图 A 的文字唯一差异是第二支动量标签（K- 换成 pi-）
      和介子名，读者正是靠这两处差异区分两个物理过程。
    primitive: 文字（含矢量符号与上下标）
    params:
      K*0_meson: "中心 (0.088,0.628)"
      p_K+: "中心 (0.095,0.505)"
      p_pi-: "中心 (0.275,0.755)"
      n̂: "中心 (0.205,0.455)"
