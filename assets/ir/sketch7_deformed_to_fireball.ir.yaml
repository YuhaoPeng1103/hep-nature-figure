# IR —— 形变核 → 量子涨落 → 碰撞 → QGP 火球（四阶段演化链）
# 任务类型：B（创作：手绘草图 → 期刊图）
# 默认路线③：IR → 简报 → 草图(+矢量化) → 闸口① → 成品位图 → 闸口② → 语义临摹
# 输入草图：hand_sketch.png（作者手绘，1470x600）—— 它定构图，样式来自 T3-02 那条线
figure:
  id: DEFORM-TO-FIREBALL-1
  source: "作者手绘草图 hand_sketch_controlled.png（自述：与 STAR 参考图同一套物理）"
  physics_claim: >
    高能重离子碰撞里，原子核不是刚性球，而是**形变**的（如 ²³⁸U 的长椭球）。
    核内**核子的位置与取向在量子力学上是涨落的**（quantum fluctuations in
    orientations）—— 所以同一个核、同一种形变，每次碰撞的"朝向"都不同。
    两核以接近光速相撞（collision），重叠区里的**参与者核子**把纵向动能沉积下来，
    形成**夸克-胶子等离子体火球**（QGP fireball）。
    物理意义：这条「形变初态 → 量子涨落 → 碰撞 → 火球几何」的链，是理解末态
    各向异性流 vₙ 的基础 —— 初态的空间偏心度 εₙ（尤其体-体 vs 尖端-尖端取向
    导致的 ε₁ 差异）经流体力学膨胀转成末态动量各向异性 vₙ。所以火球的初始几何
    不是"一个圆球"，而是由形变 + 涨落共同决定的。
    视角：**斜视 3D**（不是正侧视）—— 核与火球都画成有体积感的椭球/团块，
    用网格线与明暗表现三维；四个阶段沿**水平方向从左到右**排列，三个阶段箭头
    全部**指向右**（＝时间演化方向）。
  archetype: 示意图
  panels_count: 1
  canvas: {w: 1664, h: 928}

elements:                      # 画序 = z 序，从后往前
  # ══ 阶段 1：形变核（冷，灰） ══
  - id: S1
    name: 形变核
    physics_role: >
      基态原子核：**长椭球形变**（prolate），不是球。核内可以看见几个游离的
      核子小球（核子不是固定位置的）。
    primitive: 倾斜的椭球（长轴近似竖直/斜向，明显不是圆）+ 内部 3 个核子小球
    params: {cx: 0.10, cy: 0.50}
    material: "冷灰白渐变（球面明暗）+ 表面网格经线/纬线 + 深灰描边"
    z: 1

  # ══ 阶段 2：量子涨落（同一核的不同取向叠加） ══
  - id: S2
    name: 量子涨落
    physics_role: >
      同一个核在**不同取向上的量子叠加** —— 所以画成**多个相互重叠的椭圆**，
      每个椭圆是一种可能的取向，它们部分重叠、彼此不分离。
      这是"涨落"的图示：核心不是形状不确定，而是**朝向**在涨落。
    primitive: 三个相互重叠的倾斜椭圆（不同取向，部分重叠）
    params: {cx: 0.27, cy: 0.50}
    material: "同阶段 1 的冷灰（未激发），描边 + 网格线"
    z: 2

  # ══ 阶段 3：碰撞（两核部分重叠，重叠区可辨） ══
  - id: S3
    name: 碰撞
    physics_role: >
      两个**以接近光速相向运动**的形变核相撞。两个核的椭球**部分重叠**
      （不是分离、也不是完全重合），重叠的那一块就是**参与者区**，
      画成一个明确可辨的小椭圆/透镜形，颜色比核本体更热。
    primitive: 两个左右并排、部分重叠的椭球 + 重叠区高亮（小椭圆）
    params: {cx: 0.51, cy: 0.50}
    material: "两核冷灰；重叠区偏暖（浅橙）—— 表示开始沉积能量"
    z: 3

  # ══ 阶段 4：QGP 火球 ══
  - id: S4
    name: QGP 火球
    physics_role: >
      碰撞后形成的夸克-胶子等离子体火球。**参与者核子挤在一起、相互重叠**，
      画在大团块内部（4 个互相重叠的球），外圈是热的火球包络。
      它不是"几个分开的核子球"，而是**一个整体**（QGP）。
    primitive: 大团块（近球形/椭球）+ 内部 4 个**相互重叠**的核子球
    params: {cx: 0.77, cy: 0.50}
    material: "热橙红渐变（内核亮黄 → 边缘橙红）+ 深灰描边；内部核子球略深"
    z: 4

  # ══ 三个演化箭头 ══
  - id: E1
    name: 演化箭头
    physics_role: >
      阶段之间的**演化方向**：形变核 → 量子涨落 → 碰撞 → 火球。三个箭头
      **全部指向右**。方向反了 = 把演化画反了。
    primitive: 粗箭头 ×3（水平，自左指向右）
    params: {cx: [0.175, 0.385, 0.655], cy: 0.50}
    material: "深灰粗箭头（实心三角箭头）"
    z: 5

  # ══ 标签（每阶段正下方） ══
  - id: T1
    name: 阶段 1 标签
    physics_role: >
      阶段 1 的名字。★ 原草图这一阶段**没有**标签，是照它的自述补上的
      （草图底部写着 deformed nucleus -> ...）。要与草图严格一致就从 IR 删掉本元素。
    primitive: 文字
    params: {x: 0.10, y: 0.72, t: "deformed nucleus"}
    material: "深灰无衬线"
    z: 6

  - id: T2
    name: 阶段 2 标签
    physics_role: 阶段 2 的名字（两行）。
    primitive: 文字
    params: {x: 0.27, y: 0.72, t: "quantum fluctuations"}
    material: "深灰无衬线"
    z: 6

  - id: T3
    name: 阶段 3 标签
    physics_role: 阶段 3 的名字。
    primitive: 文字
    params: {x: 0.51, y: 0.72, t: "collision"}
    material: "深灰无衬线"
    z: 6

  - id: T4
    name: 阶段 4 标签
    physics_role: 阶段 4 的名字。
    primitive: 文字
    params: {x: 0.77, y: 0.72, t: "QGP fireball"}
    material: "深灰无衬线"
    z: 6

composition:
  view: "斜视 3D，四个阶段沿水平方向排成一行，从左到右"
  layout:
    - "四个阶段横向均匀铺开，占画布宽度约 90%（约 0.05W ~ 0.95W），垂直居中（cy≈0.5H）"
    - "每个阶段的标签放在该阶段形状的**正下方**（约 cy 0.72H），与该阶段中心对齐"
    - "三个箭头位于相邻两阶段之间的空隙里，与形状同一高度"
  note: >
    ★ 草图底部那行英文说明（"rough sketch of the SAME physics as the STAR
    reference (deformed nucleus -> fluctuations -> collision -> fireball)"）
    是**画给画图人的备注，不是图的一部分** —— 绝对不要画进配图。
    ★ 本图**不使用** (a)(b)(c) 这类面板字母编号。
    ★ 画布 1664×928：横向很宽，四阶段一行 + 标签一行，上下留白均匀。

geometry_constraints:
  # ★ 机器能判的：本图**没有**可用的机器判据 ——
  #   check_sketch 唯一的机器判据是「Lorentz 收缩方向」，它靠**饱和度**找核的大色块。
  #   本图走 T3-02 那种 3D 渲染风：核是**灰白**的（饱和度极低），只有火球是橙色。
  #   核根本不会被色彩判据选中，硬写一条只会得到"没找到彩色块"的假警报。
  #   所以本图靠下面的「约束」逐条人答，交付后再用脚本**量**（阶段 x 单调、箭头向右）。
  机器: []
  约束:
    - 名: 四个阶段从左到右排列
      量: "四个形状的横向中心 x1 < x2 < x3 < x4"
      要求: "严格单调递增"
      为什么: 这条链是**时间演化**，左右顺序就是时间顺序；顺序错 = 物理错。
    - 名: 三个箭头全部指向右
      量: "每个箭头的箭头尖在其尾部的右侧"
      要求: "3/3 全部向右"
      为什么: 箭头是演化方向。有一个画反，读者会以为过程会倒回去。
    - 名: 阶段 2 的椭圆必须相互重叠
      量: "阶段 2 里多个椭圆的交集非空"
      要求: "成立（是**同一个核的不同取向**，不是几个分开的核）"
      为什么: >
        "量子涨落"指的是同一核的**朝向**在涨落。画成几个互不相交的核 = 变成
        "有好几个核"，物理含义完全变了。
    - 名: 阶段 3 两核部分重叠
      量: "两个椭圆的交叠面积 > 0 且 < 任一个的面积（既非分离，也非完全重合）"
      要求: "成立"
      为什么: 完全分离 = 没碰撞；完全重合 = 正碰（但碰撞几何里两核中心有距离）。
    - 名: 阶段 4 内部核子球相互重叠
      量: "阶段 4 内部 4 个小球的交集非空（挤在一起）"
      要求: "成立"
      为什么: 参与者核子已经熔成一个 QGP 整体；画成 4 个分开的小球就不是火球了。
    - 名: 冷热用颜色区分
      量: "阶段 1–3 的核是灰白（低饱和），阶段 4 的火球是橙红（高饱和）"
      要求: "成立"
      为什么: >
        这张图的关键信息就是"冷核 → 热火球"。四阶段全灰 = 看不出能量沉积；
        全橙 = 看不出"碰撞前是冷的"。
    - 名: 标签在对应阶段正下方
      量: "每个标签的水平中心落在对应阶段的水平范围内"
      要求: "成立"
      为什么: 标签错位 = 指错物理对象。

style:
  classification: 半写实插画
  evidence: >
    判据（照 T3-02 那条线）：形体是 3D 的椭球/团块，体积感来自**球面明暗**
    与**表面网格线**（不是平涂）；火球有从内到外的橙→红渐变与亮核。
    但材质仍是示意性的（不是照片级——没有真实材质纹理、没有景深）。
  palette:
    核: "#f4f4f4 → #9d9d9d（灰白球面渐变）+ #6a6a6a 网格线"
    火球: "#ffd257 → #f08a2a → #d9451f"
    线/箭头/文字: "#2a2d33"
    背景: "#ffffff"
  line_widths: {outline: 1.6, arrow: 2.6, mesh: 0.9}
  fonts: {latin: "DejaVu Sans", size_steps: [14, 16, 18]}
  conventions:
    - "四个阶段必须**从左到右**排成一行，占满画布宽度的大部分；三个箭头全部**指向右**"
    - "阶段 1 的核必须是**椭球**（形变，长轴竖直或斜向，明显不是圆），表面带网格线；**不是**球"
    - "阶段 2 必须是**多个相互重叠的椭圆**（同一个核的不同取向叠加）；画成互不相交的几个核 = 错"
    - "阶段 3 两个核的椭球**部分重叠**，重叠那一小块要能辨认出来（可略偏暖色）；完全分离或完全重合 = 错"
    - "阶段 4 是**一个大团块**（火球），内部几个参与者核子球**相互重叠挤在一起**；不要画成几个分开的小球"
    - "颜色是信息：阶段 1–3 的核**冷灰**、阶段 4 的火球**热橙**；不要四阶段一个色调"
    - "视角固定：斜视 3D，四个阶段用同一个视角，不要每个阶段换角度"
    - "每个标签放在对应阶段的**正下方**，文字拼写必须完全正确（下一步会重写成真矢量文字）：deformed nucleus / quantum fluctuations / collision / QGP fireball"
    - "★ 不要画外框、不要画面板字母 (a)(b)、不要把草图底部那行英文备注画进来"
    - "★ 背景纯白，不要渐变背景、不要阴影地面、不要装饰性光晕"

execution:
  primary: imagegen
  reason: >
    风格轴：半写实 3D 插画（球面明暗 + 网格线 + 火球渐变）→ 生图模型比手写 SVG 省力，
    且这正是路线②/③ 的适用范围。物理轴由 IR 的 geometry_constraints 约束，
    闸口①/② 两道机器+人工检查把物理把住。
  fallback: [svg]
  rejected:
    - tool: matplotlib
      reason: "无数据、无坐标轴"
    - tool: blender
      reason: "形体是示意性的椭球/团块，不需要真实 3D 几何与真实光照"
  portability: "figure + elements + composition 三层完全后端无关"

assertions:
  machine:
    - "S1..S4、E1、T1..T4 全部存在"
    - "四个阶段横向中心 x 单调递增（交付后从成图上量）"
    - "三个箭头方向全部向右（交付后从成图上量）"
    - "导出矢量且文字可提取；最小字号 ≥5pt"
    - "嵌入位图 0 个"
  human:
    - "物理正确：形变 → 涨落 → 碰撞 → 火球 的链条无误，冷热用颜色区分"
    - "视觉达到可投稿水平"
