# IR —— 手绘草图 3：喷注淬火
# 输入：sketch_test/sketch3_jet.png
# 任务类型：B（创作）—— 只有草图，无参考图
figure:
  id: SKETCH-3-JET
  source: "手绘草图3（作者自绘）"
  physics_claim: >
    高能核碰撞中，一次硬部分子散射产生背对背的双喷注（dijet）。
    若散射顶点位于介质表面附近（表面偏置），两个喷注穿过的介质厚度不同：
    一个短路径逃逸，另一个穿过整个 QGP 并在其中通过胶子辐射损失能量
    （喷注淬火）。路径长度差是喷注淬火测量的物理基础。
  archetype: 示意图
  panels_count: 1

elements:                      # 画序 = z 序，从后往前
  - id: E1
    name: QGP 介质
    physics_role: >
      碰撞产生的夸克胶子等离子体——喷注在其中传播并损失能量。
      画成包裹碰撞区的有机团块，边界起伏（非正圆）。
    primitive: 有机团块（带扰动的闭合曲线）
    params: {外接半径: "约 0.34 画布宽", 扁平度: 0.72}
    material: "暖橙径向渐变 + 弥散边缘"
    z: 1

  - id: E2
    name: 入射核 ×2
    physics_role: >
      两个 Lorentz 收缩的原子核——沿束流方向压扁成薄饼，
      在中心重叠形成碰撞区。画成竖直扁椭圆。
    primitive: 扁椭圆 ×2
    params: {数量: 2, 长宽比: "约 3.2:1", 间距: "约 0.06 画布宽"}
    material: "半透明蓝紫渐变，带描边"
    z: 2

  - id: E3
    name: 硬散射顶点
    physics_role: >
      部分子硬散射发生的位置。**关键**：它偏在介质的一侧（靠近表面），
      这正是「表面偏置」——决定了两个喷注路径长度不同。
    primitive: 星芒（短线段放射）
    params: {射线数: 11, 位置: "偏向右上，距介质中心约 0.21 介质半径"}
    material: "白色高亮 + 深色描边"
    z: 3

  - id: E4
    name: 逃逸喷注
    physics_role: >
      朝短路径方向出射的喷注——穿过介质很薄，几乎不损失能量，
      以接近原始的横动量逃逸。
    primitive: 粗箭头（渐细）
    params: {方向: "左上方", 长度: "约 0.35 画布宽"}
    material: "亮黄色渐变，末端加锥形表示喷注准直"
    z: 4

  - id: E5
    name: 被淬火喷注
    physics_role: >
      朝长路径方向出射的喷注——穿过整个介质，通过**胶子辐射**损失能量，
      出射时横动量显著降低。这是喷注淬火的核心观测量。
    primitive: 渐细箭头 + 沿途的胶子辐射螺旋
    params: {方向: "右下方", 长度: "约 0.55 画布宽", 胶子线: "4-6 条"}
    material: "由亮转暗的渐变（能量衰减的视觉表达）"
    z: 5

  - id: E6
    name: 介质尾迹
    physics_role: >
      喷注在介质中传播时对介质的扰动（激波/马赫锥），
      是能量沉积进介质的可视化表达。
    primitive: 沿喷注路径的弧形波纹
    params: {数量: "3-4 道"}
    material: "白色半透明，低不透明度"
    z: 6

  - id: E7
    name: 文字标注
    physics_role: 元素命名
    primitive: 文字
    text: "nucleus A/B, hard scattering, escaping jet, quenched jet, QGP medium"
    z: 7

composition:
  canvas: {ratio: "约 2.07（很宽）", 用途: "双栏图"}
  视角: 正视，无透视。碰撞区居中，两个喷注呈背对背。
  分区: 中央为碰撞区与介质；左上为逃逸喷注，右下为被淬火喷注。
        两喷注大致共线（背对背），夹角约 180°±15°。
  元素布局:
    - id: E1
      锚点: [0.45, 0.50]
      相对尺寸: "横向约 0.34 画布宽"
    - id: E2
      锚点: [[0.41, 0.50], [0.50, 0.50]]
      相对尺寸: "每个高约 0.32 画布高"
    - id: E3
      锚点: [0.47, 0.41]
      备注: "偏离介质中心约 [0.02, -0.09]，即偏右上——这是表面偏置"
    - id: E4
      锚点: "从 E3 指向 [0.27, 0.10]"
    - id: E5
      锚点: "从 E3 指向 [0.82, 0.83]"
    - id: E7
      锚点: "各元素旁，不遮挡主体"
  叠放关系: >
    介质在最底层；入射核压在介质上；硬散射顶点最亮；
    两个喷注在介质之上（表示它们从介质中穿出）；
    介质尾迹压在喷注之下、介质之上。

style:
  classification: 矢量插画 + 半写实元素
  evidence: >
    结构与参考库 T3 同类：介质与核子用径向渐变做体积感（半写实），
    喷注与标注用干净矢量线条。明暗是画出来的，不是光照计算的
    —— 判据：所有球体的高光都在同一方向。
  palette:
    介质: "#ffb060 → #f06020 → 透明"
    入射核: "#8a9ee0 → #5a6fd0"
    逃逸喷注: "#ffe066 → #ffb020"
    淬火喷注: "#ffd060 → #a04010（由亮转暗，表达能量衰减）"
    胶子线: "#c07030"
    背景: "#ffffff"
  line_widths: {outline: 1.2, jet: 6.0, gluon: 1.6}
  fonts: {latin: "DejaVu Sans", size_steps: [13, 16, 19, 22]}
  conventions:
    - "淬火喷注的粗细沿路径递减（能量损失的视觉语言）"
    - "介质边缘必须弥散，不能有硬边"

execution:
  primary: svg
  reason: >
    内容轴：无数据、形状是表达手段 → 指向 SVG。
    风格轴：矢量插画 + 局部半写实 → SVG/Inkscape。
    两轴一致。全部元素都是几何图形，无真实 3D 几何需求。
  style_switch: >
    同一份 figure + elements，若风格改为「照片级渲染」，
    应改用 blender；前两层不动。
  fallback: [illustrator, matplotlib]
  rejected:
    - tool: blender
      reason: "无真实 3D 几何需求；默认渲染风格与矢量插画冲突"
    - tool: imagegen
      reason: >
        草图给的是结构和物理关系，没给粒子数、色值、角度。
        图像生成每次随机决定这些，无法保证与草图一致，也无法复现。
    - tool: mathematica
      reason: "实测 3D 导出会栅格化，交不出投稿级矢量"
    - tool: tikz
      reason: >
        本图无公式、无数学排版需求；TikZ 做渐变与发光很别扭。
        若有公式面板再加（见 references/multi-tool.md）。
  portability: "figure + elements 两层完全后端无关"

assertions:
  machine:
    - "E1..E7 全部存在"
    - "硬散射顶点偏离介质几何中心（表面偏置必须体现出来）"
    - "两个喷注大致背对背（夹角在 150°–210° 之间）"
    - "★ 顶点到介质中心的距离 / 介质半径 > 0.65（真的要靠近表面）"
    - "★ 逃逸喷注的方向与『顶点→介质中心』矢量的点积 < 0（朝外飞）"
    - "★ 逃逸喷注在介质内的路径长度 < 介质半径的 0.5 倍"
    - "★ 淬火喷注在介质内的路径长度 > 介质半径的 1.2 倍"
    - "淬火喷注的线宽沿路径递减"
    - "淬火喷注沿途有胶子辐射线（≥4 条）"
    - "介质边缘无硬边；导出矢量且文字可提取"
    - "最小字号 ≥5pt"
  human:
    - "物理正确：表面偏置 → 路径长度差 → 能量损失差，因果链无误"
    - "淬火喷注确实穿过了介质，逃逸喷注没有"
    - "视觉达到可投稿水平"

# ── 物理核对要点（防"画得漂亮但物理错"）
# 1. 介质必须【包裹】碰撞区，不能只在一侧 —— 否则逃逸喷注没穿过介质
# 2. 两个喷注必须【背对背】源自同一顶点 —— 它们是同一次硬散射的产物
# 3. 顶点必须【偏离】介质中心 —— 这是表面偏置，也是路径差的原因
# 4. 能量损失的表达应该是【胶子辐射】，不只是"箭头变细"
