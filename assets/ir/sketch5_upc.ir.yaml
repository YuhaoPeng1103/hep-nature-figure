# IR —— 手绘草图 5：超周边碰撞（UPC）
# 输入：sketch_test/sketch5_upc.png
# 任务类型：B（创作）
# ★ 本图用于验证【完整闭环】：草图 → IR → 实现 → 门禁 → 迭代 → 交付
figure:
  id: SKETCH-5-UPC
  source: "手绘草图5（作者自绘）"
  physics_claim: >
    超周边碰撞：两个重核以接近光速相向运动，碰撞参数 b 大于两核半径之和，
    因此核物质【不重叠】，强相互作用不发生；但两核的强电磁场随核运动，
    等效为大量准实光子。两个光子可发生 γγ 相互作用（如 γγ→e⁺e⁻、
    或者相干光致产生），这是 UPC 的核心物理。
  archetype: 示意图
  panels_count: 1

elements:                      # 画序 = z 序，从后往前
  - id: E1
    name: 入射/出射核 ×4
    physics_role: >
      两个核在碰撞前后的位置。每个核都是 Lorentz 收缩的（纵向压扁），
      因为它们以接近光速运动。上核 A 向右、下核 B 向左——【相向运动】。
    primitive: 竖直扁椭圆 ×4（每个核画"前/后"两个位置暗示运动）
    params: {长宽比: "约 2.2:1", 上下核中心间距: "约 0.39 画布高"}
    material: "蓝紫渐变 + 深色描边"
    z: 1

  - id: E2
    name: 速度箭头 ×4
    physics_role: >
      展示两核的运动方向。**关键：上核箭头向右、下核箭头向左**——
      相向运动是 UPC 的前提（否则不叫碰撞）。
    primitive: 水平箭头 ×4（每核前后各一）
    material: "深色"
    z: 2

  - id: E3
    name: 碰撞参数 b
    physics_role: >
      两核中心之间的最近距离（在横向上）。b > R_A + R_B 是 UPC 的定义条件——
      保证核物质不重叠，只有电磁相互作用。
    primitive: 竖直虚线 + 上下核中心水平参考线 + 标签
    material: "虚线，深色"
    z: 3

  - id: E4
    name: 光子交换线 ×2
    physics_role: >
      两核电磁场等效的准实光子。画在两核之间的竖直方向，
      表示光子从核 A 传播到核 B。
    primitive: 弹簧线（螺旋）
    params: {数量: 2, 波数: 4}
    material: "深色细线"
    z: 4

  - id: E5
    name: 相互作用顶点
    physics_role: >
      γγ 相互作用的时空点。两个光子在此碰撞产生末态粒子。
    primitive: 星芒
    params: {射线数: 11}
    material: "深色"
    z: 5

  - id: E6
    name: 末态粒子 ×2
    physics_role: >
      相互作用产生的末态粒子对（如 e⁺e⁻）。
    primitive: 从顶点向外的箭头 ×2 + 符号标签
    material: "深色"
    z: 6

  - id: E7
    name: 文字标注
    physics_role: 元素命名
    primitive: 文字
    text: "nucleus A/B, v, b, γ, γγ→X, e⁺, e⁻"
    z: 7

composition:
  canvas: {ratio: "约 2.1（横）", 用途: "双栏图"}
  视角: 侧视图。束流方向水平，两核上下错开。
  分区: 左右为核的前后位置，中央为相互作用区。
  元素布局:
    - id: E1
      锚点: "四个核：[[0.25,0.31],[0.75,0.31],[0.25,0.69],[0.75,0.69]]"
      相对尺寸: "每个高约 0.24 画布高"
    - id: E3
      锚点: "b 的虚线在 [0.50, 0.31]–[0.50, 0.69] 之间"
    - id: E5
      锚点: [0.50, 0.50]
    - id: E6
      锚点: "从顶点指向 [0.63,0.40] 和 [0.63,0.60]"
  叠放关系: >
    核与箭头在底层；光子线在中间；顶点与末态粒子在最上层。

geometry_constraints:
  # ★ 本图的物理正确性靠这几条守住
  约束:
    - 名: 两核相向运动
      量: "dot(A 的速度方向, B 的速度方向)"
      要求: "< 0"        # 点积为负 = 方向相反 = 相向
      为什么: >
        这是 UPC 的定义。如果两核同向运动，就不是碰撞了。
        （实测踩坑：第一版草图把两核画成静止/同向，双向箭头像在振荡。）
    - 名: 两核不重叠
      量: "上下核中心的竖直距离 − (r_A + r_B)"
      要求: "> 0"
      为什么: >
        这是 UPC 的定义条件 b > R_A + R_B。如果核重叠了，
        就是普通重离子碰撞（会形成 QGP），不是 UPC。
    - 名: 光子线在两核之间
      量: "光子线两端的 y 坐标分别属于上核与下核的竖直范围"
      要求: "成立"
      为什么: 光子是从一个核传到另一个核的，不该跑到核外面
    - 名: 末态粒子背对背
      量: "dot(两个末态粒子的方向)"
      要求: "< 0"
      为什么: 两体衰变/产生在质心系中末态背对背

style:
  classification: 矢量插画
  evidence: >
    与参考库 T3 同类：纯矢量线条 + 简洁描边，无材质纹理，
    明暗不需要（本图没有体积感需求）。
  palette:
    核: "#8a9ee0 → #4a5cb8"
    线/箭头/文字: "#1d2026"
    背景: "#ffffff"
  line_widths: {outline: 1.8, arrow: 2.4, coil: 1.6}
  fonts: {latin: "DejaVu Sans", size_steps: [13, 15, 17, 19]}
  conventions:
    - "核必须画成纵向压扁的椭圆（Lorentz 收缩）"

execution:
  primary: svg
  reason: >
    内容轴：无数据、纯几何线条 → SVG。
    风格轴：矢量插画（线稿型）→ SVG；若追求更硬的线稿感可换 TikZ。
    本图无渐变/发光需求，两轴都指向线稿型后端。
  style_switch: >
    若风格改为「TikZ 硬线稿」，可用 tikz 重画；figure + elements 不变。
    本图恰好是 TikZ 的好用例（纯线条、无渐变需求）。
  fallback: [tikz, matplotlib]
  rejected:
    - tool: blender
      reason: "无真实 3D 几何需求"
    - tool: imagegen
      reason: "元素位置需精确，随机采样无法保证"
  portability: "figure + elements 两层完全后端无关"

assertions:
  machine:
    - "E1..E7 全部存在"
    - "两核速度方向相反（点积 < 0）"
    - "两核不重叠（竖直间距 > 两核半径和）"
    - "光子线连接上下两核之间"
    - "末态粒子背对背（点积 < 0）"
    - "导出矢量且文字可提取；最小字号 ≥5pt"
  human:
    - "物理正确：UPC 的定义（不重叠 + 电磁相互作用）表达无误"
    - "视觉达到可投稿水平"

# ── 物理核对要点
# 1. 两核必须【相向】运动（方向相反），这是"碰撞"的前提
# 2. 两核必须【不重叠】——重叠了就是普通重离子碰撞，不是 UPC
# 3. 相互作用是【电磁】的（光子交换），不是强相互作用
# 4. 末态粒子背对背
