# IR —— 自旋关联（Λ–Λ̄ 超子对的自旋关联）
# 任务类型：B（创作）
# 默认路线③：IR → 简报 → 草图(+矢量化) → 闸口① → 成品位图 → 闸口② → 临摹
figure:
  id: SPIN-CORR-1
  source: "作者描述（自旋关联示意图）"
  physics_claim: >
    非中心重离子碰撞中，参与碰撞的核物质带有巨大的轨道角动量 L（垂直于反应平面）。
    这个角动量以涡旋（vorticity ω）的形式传给夸克-胶子等离子体（QGP），
    使其中的夸克与强子沿 L 方向【整体极化】。Λ 与 Λ̄ 超子在同一个事件中成对产生，
    它们的自旋不仅各自沿 L 极化，而且【彼此关联】—— 这就是「自旋关联」：
    在 ΛΛ̄ 对的静止系里测量两个超子自旋方向之间的关联。自旋方向靠弱衰变的
    自分析特性读出来（Λ→p π⁻、Λ̄→p̄ π⁺）：质子最可能沿自旋方向飞出，
    所以末态质子/反质子的出射方向就是自旋方向的指针。
    物理意义：自旋关联偏离「无关联」基线，是 QGP 中夸克自旋自由度、
    乃至自旋纠缠（quantum entanglement）的直接探针。
    视角：斜视图（不是正侧视）—— 束流 z 水平，L 竖直向上。
  archetype: 示意图
  panels_count: 2
  canvas: {w: 1664, h: 928}

elements:                      # 画序 = z 序，从后往前
  # ══ 面板 (a)：碰撞几何 + 整体极化 ══
  - id: A1
    name: 入射核
    physics_role: >
      非中心碰撞的核 A，沿水平束流向右运动。核以接近光速运动，必须画成
      Lorentz 收缩的形状（高瘦）。
    primitive: 高瘦椭圆（长轴竖直；沿水平束流方向压扁 = Lorentz 收缩）
    params: {cx: 0.10, cy: 0.42, 长宽比: "约 1.8:1（高/宽）"}
    material: "蓝紫渐变 + 深色描边"
    z: 1

  - id: A1b
    name: 入射核
    physics_role: >
      非中心碰撞的核 B，沿水平束流向左运动 —— 与核 A【相向】。
      它与核 A 的横向中心错开一个碰撞参数 b，所以是【非中心】碰撞。
    primitive: 高瘦椭圆（长轴竖直；沿水平束流方向压扁 = Lorentz 收缩）
    params: {cx: 0.39, cy: 0.60, 长宽比: "约 1.8:1（高/宽）"}
    material: "蓝紫渐变 + 深色描边"
    z: 1

  - id: A2
    name: 束流轴 z
    physics_role: 两核的运动方向轴（标签写作 z），水平贯穿面板 (a) 的两核。
    primitive: 水平虚线 + 标签 z
    material: "深灰细虚线"
    z: 2

  - id: A3
    name: 碰撞参数 b
    physics_role: >
      两核中心的横向间距，垂直于束流。b > 0 = 非中心碰撞，
      系统才带轨道角动量 L。画成一条连接两核中心的短双向箭头。
    primitive: 双向箭头 + 标签 b（连接两核中心）
    material: "深灰"
    z: 3

  - id: A4
    name: 轨道角动量 L
    physics_role: >
      碰撞系统的轨道角动量，方向【垂直于反应平面】。这是全图所有自旋方向的
      【参考轴】：整体极化就是沿 L。画成从碰撞中心竖直向上的粗箭头。
    primitive: 粗箭头（竖直向上）
    params: {cx: 0.245, cy: 0.24}
    material: "深色粗箭头"
    z: 4

  - id: A5
    name: QGP 火球与涡旋
    physics_role: >
      碰撞区形成的夸克-胶子等离子体。它携带角动量，表现为涡旋 ω ——
      用两条环绕火球的弧形箭头表示「整体在转」。
    primitive: 中央团块 + 环绕的弧形箭头 ×2
    params: {cx: 0.245, cy: 0.51}
    material: "暖色（橙红）团块 + 深色弧形箭头"
    z: 5

  - id: A6
    name: 极化的超子
    physics_role: >
      从 QGP 中产生的 Λ。它的自旋沿 L 方向【整体极化】—— 自旋箭头与 L【同向】。
      两个超子（Λ 与 Λ̄）的自旋都朝上、彼此平行，这才叫「整体极化」。
    primitive: 小符号 Λ + 自旋箭头（与 L 平行向上）
    params: {cx: 0.175, cy: 0.72}
    material: "深色符号 + 深色箭头"
    z: 6

  - id: A6b
    name: 极化的超子
    physics_role: >
      从 QGP 中产生的 Λ̄。它的自旋同样沿 L 方向【整体极化】——
      自旋箭头与 L【同向】。两个超子的自旋【同向】才是「整体极化」。
    primitive: 小符号 Λ̄ + 自旋箭头（与 L 平行向上）
    params: {cx: 0.315, cy: 0.30}
    material: "深色符号 + 深色箭头"
    z: 6

  - id: A7
    name: 速度箭头
    physics_role: >
      两核的运动方向。★ 关键：核 A 的箭头**向右**、核 B 的箭头**向左**——
      【相向】才是碰撞。没有箭头，读图的人看不出这是碰撞还是两个核静止。
    primitive: 水平箭头（每个核各一个）
    params: {方向: "核 A 向右、核 B 向左（相向）"}
    material: "深色实心箭头"
    z: 7

  # ══ 面板 (b)：ΛΛ̄ 对的自旋关联 ══
  - id: B1
    name: ΛΛ̄ 对
    physics_role: >
      同一事件中产生的一对 Λ 与 Λ̄。在【对的静止系】里它们【背对背】飞出：
      Λ 向左、Λ̄ 向右，动量大小相等、方向相反。
    primitive: 两个圆点（左 Λ、右 Λ̄）+ 各自反向的动量箭头
    params: {cx: 0.74, cy: 0.50}
    material: "深蓝圆点 + 深色箭头"
    z: 7

  - id: B2
    name: 自旋矢量
    physics_role: >
      Λ 的自旋方向。关联就体现在它与 Λ̄ 自旋矢量的【相对取向】上：
      两个自旋不是各自独立随机，而是彼此相关。
    primitive: 从超子发出的粗箭头
    params: {cx: 0.66, cy: 0.50}
    material: "深色粗箭头"
    z: 8

  - id: B2b
    name: 自旋矢量
    physics_role: >
      Λ̄ 的自旋方向。它与 Λ 的自旋矢量的相对取向就是「自旋关联」本身。
    primitive: 从超子发出的粗箭头
    params: {cx: 0.82, cy: 0.50}
    material: "深色粗箭头"
    z: 8

  - id: B3
    name: 弱衰变末态
    physics_role: >
      Λ 弱衰变 Λ→p π⁻。弱衰变是【自分析】的：质子最可能沿超子自旋方向飞出，
      所以质子出射方向就是自旋方向的指针。画出质子与介子两条细箭头。
    primitive: 从超子发出的两条细箭头（分别指向质子与介子）+ 符号
    params: {夹角: "质子方向与自旋方向的夹角记为 θ*"}
    material: "深色细箭头"
    z: 9

  - id: B3b
    name: 弱衰变末态
    physics_role: >
      Λ̄ 弱衰变 Λ̄→p̄ π⁺。同样自分析，反质子出射方向标记 Λ̄ 的自旋方向。
      画出反质子与介子两条细箭头。
    primitive: 从超子发出的两条细箭头（分别指向反质子与介子）+ 符号
    material: "深色细箭头"
    z: 9

  - id: B4
    name: 关联角 θ*
    physics_role: >
      在 ΛΛ̄ 对静止系里，两个衰变质子出射方向之间的夹角 —— 自旋关联的观测量
      （严格说是两个超子各自相对自旋方向的 θ* 的联合分布）。
    primitive: 两条末态质子方向之间的圆弧 + 标签 θ*
    material: "深色圆弧"
    z: 10

  - id: T1
    name: 文字标注
    physics_role: 面板标号与几何量
    primitive: 文字
    text: "(a), (b), z, b, L, ω, QGP, reaction plane"
    z: 11

  - id: T2
    name: 文字标注
    physics_role: 粒子符号（上下标必须对）
    primitive: 文字
    text: "Λ, Λ̄, p, π⁻, p̄, π⁺, θ*"
    z: 11

  - id: T3
    name: 文字标注
    physics_role: 面板(b) 的坐标系说明
    primitive: 文字
    text: "pair rest frame"
    z: 11

composition:
  canvas: {ratio: "约 1.79（横）", 用途: "双栏图"}
  layout: >
    【斜视图】。左右两个面板，中间留白分隔：(a) 在左（约占画布 x=0.02..0.47），
    (b) 在右（约占画布 x=0.53..0.98）。两个面板各自独立取景，
    【不要在两面板之间连线或画箭头】。左上角标 (a)、右上角标 (b)。
  note: >
    (a) 碰撞几何 + 整体极化：**两条水平束流虚线**（上下平行分开约 0.2 画布高），
    蓝核对齐上面那条、红核对齐下面那条，各自沿自己的线相向运动；
    b 是连接两核中心的**竖直**双向箭头（长度 = 两线间距）；
    中央是橙红色 QGP 火球与绕它的两条涡旋弧线；L 是从火球向【正上方】的
    竖直粗箭头；两个超子画在火球附近，它们的自旋箭头【与 L 平行且同向（都朝上）】。
    (b) ΛΛ̄ 对的自旋关联：中央是左 Λ、右 Λ̄ 两个圆点，动量箭头背对背
    （左边指向左、右边指向右）；每个超子各画一个自旋箭头（粗）；
    各自的弱衰变画出两条末态细箭头（质子 + 介子）；两个末态质子方向之间
    画一段圆弧标 θ*。整体清爽，形体边界清楚。

geometry_constraints:
  # ★ 本图的物理正确性靠这几条守住
  约束:
    - 名: 非中心碰撞
      量: "碰撞参数 b > 0 —— 两核各自有一条水平束流虚线，两条虚线**上下平行分开**，间距就是 b；两核各自对齐自己那条线"
      要求: "成立"
      为什么: >
        b = 0 是中心碰撞，轨道角动量为 0，整体极化与自旋关联都会消失。
        b > 0 是本图全部物理的前提。
    - 名: L 垂直于反应平面
      量: "L 的方向 ⊥（束流 z 与碰撞参数 b 张成的平面）"
      要求: "成立（画成竖直向上的粗箭头）"
      为什么: >
        L = r × p：r 沿 b（反应平面内）、p 沿 z ⇒ L 垂直于反应平面。
        画成「在反应平面内」的箭头 = 错。
    - 名: 两核相向运动
      量: "dot(A 的速度方向, B 的速度方向)"
      要求: "< 0"
      为什么: 相向才是碰撞。同向就是两个核一起飞，不是碰撞。
    - 名: 面板(a) 两个超子自旋同向
      量: "核 A 侧与核 B 侧两个超子的自旋箭头都沿 L、且同向"
      要求: "成立"
      为什么: >
        「整体极化」的定义就是所有超子平均自旋沿 L 同向。
        若画成反向，就把「整体极化」与「自旋关联」混为一谈了。
    - 名: 面板(b) ΛΛ̄ 背对背
      量: "dot(Λ 的动量方向, Λ̄ 的动量方向)"
      要求: "< 0"
      为什么: 在对的静止系里，两体末态动量相反。
    - 名: 末态质子 vs 自旋有夹角
      量: "质子出射方向与自旋方向不共线（夹角 θ* ≠ 0）"
      要求: "成立"
      为什么: >
        弱衰变是自分析的：质子【偏向】自旋方向但不是严格沿自旋方向，
        所以才有一个 θ* 分布。两者画成同一条线就把 θ* 抹掉了。

  # ★ 机器能判的（check_sketch 自动量，不用人回答）
  机器:
    - 名: 两核沿束流方向压扁（Lorentz 收缩）
      量: "每个核的彩色像素块 bbox 的高/宽"
      束流方向: horizontal
      阈值: 1.25
      要求: "> 1.25"
      为什么: >
        核以接近光速沿水平束流运动，Lorentz 收缩沿运动方向 ⇒ 必须画成高瘦
        椭圆。横扁 = 收缩轴垂直于速度 = 物理错。

style:
  classification: 矢量插画
  evidence: >
    与参考库 T3 同类（T3-09 是同一物理家族的邻图：碰撞余波 + QGP 涡旋 + 极化，
    画面里就有 Λ、自旋、θ* 这套词汇）：矢量形体 + 明确描边，
    体积感来自明暗渐变，不用照片级材质。
  palette:
    核: "#8a9ee0 → #4a5cb8"
    QGP火球: "#f0a04a → #c8442a"
    线/箭头/文字: "#1d2026"
    背景: "#ffffff"
  line_widths: {outline: 1.8, arrow: 2.4, thin: 1.4}
  fonts: {latin: "DejaVu Sans", size_steps: [12, 14, 16, 18]}
  conventions:
    - "两个核都必须画成**高瘦**椭圆（沿水平束流方向压扁 = Lorentz 收缩，高/宽 ≳ 1.25）；画成横扁 = 错"
    - "两核必须**上下明显错开**：各自一条水平束流虚线，两条线平行分开约 0.2 画布高，核各自对齐自己那条线；画在**同一条线**上 = 中心碰撞（b=0）= 整条物理链失效"
    - "b 是连接两核中心的**竖直**双向箭头（长度 = 两条束流线的间距），两端要真的落在两核中心上；不要画成一根悬空的箭头"
    - "每个核都要画一个**水平速度箭头**（核 A 向右、核 B 向左）—— 没有箭头就看不出这是【相向碰撞】；实测：不写这条时 2/2 张草图都漏了速度箭头"
    - "L 必须画成**竖直向上**的粗箭头（垂直反应平面）；不要画成水平的面内箭头"
    - "面板(a) 里两个超子的自旋箭头必须**与 L 同向**（都朝上）—— 这是「整体极化」；一上一下就是错的"
    - "面板(b) 里 Λ 与 Λ̄ 的动量箭头必须**背对背**（一个向左、一个向右）"
    - "面板(b) 里 θ* 要画在「质子方向」与「它自己那个超子的自旋方向」之间（不是画在两个自旋之间），并标成 θ*；两边都要画，不要只画一边"
    - "面板(b) 里质子方向与自旋方向**不重合**，要留出 θ* 的夹角"

execution:
  primary: svg
  reason: >
    内容轴：无数据、纯几何线条 + 少量渐变 → SVG。
    风格轴：矢量插画（线稿型 + 明暗）→ SVG。
  fallback: [tikz, matplotlib]
  rejected:
    - tool: blender
      reason: "无真实 3D 几何需求"
    - tool: imagegen
      reason: "元素位置需精确；imagegen 只在路线②/③的草图与成品位图两步里用"
  portability: "figure + elements 两层完全后端无关"

assertions:
  machine:
    - "A1/A1b/A2..A6b、B1..B4、T1..T3 全部存在"
    - "两个核的高/宽比 ≥ 1.25（沿水平束流压扁）"
    - "面板(a) 两个自旋箭头同向"
    - "面板(b) 两个动量箭头背对背（点积 < 0）"
    - "导出矢量且文字可提取；最小字号 ≥5pt"
  human:
    - "物理正确：非中心碰撞 → L → 涡旋 → 整体极化 → 自旋关联 的链条表达无误"
    - "视觉达到可投稿水平"